<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trick or Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&family=Rubik+Mono+One&display=swap">
<style>
/* Trick or Trade — a haunted stock exchange that lives on everyone's phone. The room creator's phone quietly runs the market. */
:root{
  --void:#120b1a; --grave:#1c1228; --tomb:#291b39; --line:#463160;
  --bone:#f6eddc; --mist:#b8a7cc; --pumpkin:#ff7a1a; --candy:#ffd23f; --up:#8be04e; --down:#ff4d6a; --blood:#ff3a5c;
  --f-logo:"Creepster","Fredoka",cursive;
  --f-ui:"Fredoka","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tick:"Rubik Mono One","Fredoka",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--bone);font-family:var(--f-ui);font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow-x:hidden;
  background:radial-gradient(80vmax 50vmax at 100% 0%,rgba(255,122,26,.12),transparent 60%),radial-gradient(70vmax 60vmax at 0% 100%,rgba(139,224,78,.06),transparent 60%),var(--void);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--candy);outline-offset:3px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.logo{font-family:var(--f-logo);font-weight:400;letter-spacing:.02em;line-height:1;margin:0;color:var(--pumpkin);white-space:nowrap}
.logo .or{color:var(--bone);font-size:.6em;vertical-align:.18em;margin:0 .12em}
.tk{font-family:var(--f-tick);letter-spacing:-.02em}
.muted{color:var(--mist)}
.small{font-size:14px}
.center{text-align:center}
.htags{color:var(--candy);font-weight:600;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-size:19px;font-weight:600;line-height:1.2;
  background:var(--pumpkin);color:#1a0a00;box-shadow:0 4px 0 #a8460a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8460a}
.btn[disabled]{background:var(--tomb);color:var(--mist);box-shadow:none;cursor:not-allowed}
.btn.sec{background:var(--tomb);color:var(--bone);box-shadow:0 4px 0 #0b0610}
.btn.ok{background:var(--up);color:#0d1a05;box-shadow:0 4px 0 #4f8a26}
.btn.wide{width:100%}
.btn.huge{font-size:21px;padding:17px 18px}
.link{background:none;border:0;padding:8px;color:var(--mist);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.card{background:var(--grave);border:2px solid var(--line);border-radius:20px;padding:16px}
input[type=text]{width:100%;background:var(--void);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:18px}
input[type=text]:focus{border-color:var(--pumpkin);outline:none}
label{display:block;font-weight:600;margin:0 0 6px}
.field{margin-bottom:16px}
.opt{font-weight:400;color:var(--mist);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:15px;color:var(--mist)}
.chip.on{border-color:var(--pumpkin);color:var(--candy);background:rgba(255,122,26,.12)}
.title{font-size:25px;font-weight:700;line-height:1.2;margin:0}
.sub{color:var(--mist);margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}

/* header + exchange tape */
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:12px 10px}
.head .logo{font-size:27px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--tomb);border-radius:999px;padding:4px 12px;font-size:14px;min-width:0;max-width:52%}
.pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.pill.off .dot{background:var(--down)}
.tape{overflow:hidden;white-space:nowrap;background:var(--grave);border-block:1px solid var(--line);height:38px;display:flex;align-items:center}
.tape .run{display:inline-flex;gap:28px;padding-left:16px;animation:tape var(--dur,28s) linear infinite;will-change:transform}
.tape .it{font-family:var(--f-tick);font-size:13px;display:inline-flex;gap:8px;align-items:baseline}
.tape .px{color:var(--bone)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mist)}
@keyframes tape{to{transform:translateX(-50%)}}
.hostbar{background:rgba(255,122,26,.12);border-bottom:1px solid rgba(255,122,26,.4);font-size:13px;padding:6px 0;color:var(--candy)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.steps div{height:5px;border-radius:3px;background:var(--tomb)}
.steps div.done{background:var(--mist)} .steps div.now{background:var(--pumpkin)}
.stepname{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:12px;color:var(--mist);margin-top:4px;text-align:center}
.stepname b{color:var(--bone);font-weight:600}
main{padding-block:16px 40px}

/* landing */
.landing{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:28px}
.landing .logo{font-size:clamp(60px,17vw,96px);white-space:normal}
.joinrow{display:flex;gap:10px}
.joinrow input{text-transform:uppercase;font-family:var(--f-tick);font-size:22px;letter-spacing:.1em;text-align:center;min-width:0}

/* cards */
.stock{background:linear-gradient(160deg,var(--tomb),var(--grave));border:2px solid var(--pumpkin);border-radius:20px;padding:16px}
.stock .tk{font-size:36px;color:var(--pumpkin);line-height:1.05}
.stock .htags{font-size:18px;margin-top:6px}
.stock .pitch{font-size:16px;margin-top:6px;overflow-wrap:anywhere}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--tomb);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--candy);border-radius:4px;transition:width .25s linear}
.bar.urgent i{background:var(--down)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{border:2px solid var(--line);background:var(--grave);border-radius:14px;padding:11px 10px;font-size:15px;font-weight:600;min-height:56px;text-align:center;line-height:1.25}
.qbtn:active{border-color:var(--pumpkin)}
.qbtn[disabled]{opacity:.35;cursor:default}
.qa{background:var(--grave);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.qa .q{font-weight:600;overflow-wrap:anywhere}
.qa .a{font-weight:600;margin-top:2px}
.a.yes{color:var(--up)} .a.no{color:var(--down)} .a.kinda{color:var(--candy)} .a.wait{color:var(--mist);font-weight:400;font-style:italic}
.answer{border:2px solid var(--pumpkin)}
.abtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.abtns button{border:2px solid var(--line);background:var(--tomb);border-radius:12px;padding:12px 4px;font-weight:600;font-size:17px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font-size:16px;padding:11px 12px}
.inrow .btn{padding:10px 16px;font-size:16px;flex:none}
.code{font-family:var(--f-tick);font-size:44px;color:var(--candy);letter-spacing:.08em;line-height:1}
.qr{background:var(--bone);padding:10px;border-radius:14px;line-height:0;display:inline-block}
.qr img,.qr canvas{width:180px!important;height:180px!important}
.who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.who span{background:var(--tomb);border-radius:999px;padding:4px 12px;font-size:15px;border:1px solid var(--line)}
.who span.ready{border-color:var(--up);color:var(--up)}

/* bidding */
.sticky{position:sticky;top:0;z-index:5;background:var(--void);padding:8px 0;border-bottom:2px solid var(--line)}
.candy{font-family:var(--f-tick);font-size:30px;color:var(--candy);line-height:1}
.candy.zero{color:var(--up)}
.bid{background:var(--grave);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.bid.has{border-color:var(--candy)}
.bid.mine{border-style:dashed}
.bid .tk{font-size:20px;color:var(--pumpkin)}
.bid .t{font-size:14px;color:var(--candy);overflow-wrap:anywhere}
.mkt{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--f-tick);font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.mkt svg{flex:none}
.mkt .lbl{color:var(--mist);font-family:var(--f-ui);font-size:13px}
.pm{display:flex;align-items:center;gap:6px}
.pm button{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--tomb);font-size:24px;font-weight:700;line-height:1}
.pm button[disabled]{opacity:.3;cursor:not-allowed}
.pm .v{min-width:40px;text-align:center;font-family:var(--f-tick);font-size:20px}
.pm .v.has{color:var(--candy)}
.bottom{padding-top:6px}

/* the show */
.show{border:2px solid var(--blood);border-radius:20px;padding:16px;background:var(--grave);animation:pop .4s ease-out}
.show.neutral{border-color:var(--line)}
.show .lab{font-family:var(--f-tick);font-size:12px;color:var(--mist);letter-spacing:.02em}
.show .main{font-size:24px;font-weight:700;margin:6px 0 2px;overflow-wrap:anywhere;line-height:1.25}
.show .main .tk{color:var(--pumpkin)}
.show .price{font-family:var(--f-tick);font-size:26px;color:var(--candy)}
.show .note{color:var(--mist);font-size:15px;margin-top:6px;overflow-wrap:anywhere}
.diagram{background:var(--grave);border:1px solid var(--line);border-radius:18px;padding:8px}
.diagram svg{display:block;width:100%;height:auto}
.diagram text{font-family:var(--f-ui);fill:var(--bone)}
.diagram .tkt{font-family:var(--f-tick);fill:var(--pumpkin)}
.diagram .dim{opacity:.35}
.diagram .str{fill:none;stroke:var(--blood);stroke-width:3;stroke-linecap:round}
.diagram .str.new{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s ease-out forwards}
.diagram .frz{fill:none;stroke:var(--mist);stroke-width:2;stroke-dasharray:5 5}
.diagram .node{fill:var(--tomb);stroke:var(--line);stroke-width:2}
.diagram .node.lit{stroke:var(--pumpkin)}
@keyframes draw{to{stroke-dashoffset:0}}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--grave);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.lrow.me{border-color:var(--up)}
.lrow .l{overflow-wrap:anywhere}
.lrow .r{font-family:var(--f-tick);font-size:14px;color:var(--candy);white-space:nowrap}
.lrow .tk{color:var(--pumpkin)}
.lrow .s{grid-column:1/-1;font-size:13px;color:var(--mist);overflow-wrap:anywhere}
.result{text-align:center}
.result .tk{font-size:40px;color:var(--pumpkin)}
.result .from{font-size:20px;margin-top:10px}
.result .from b{color:var(--blood)}
.bigword{font-family:var(--f-logo);font-size:44px;color:var(--pumpkin);line-height:1.05}
.count{font-family:var(--f-tick);font-size:60px;color:var(--candy);line-height:1}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tomb);border:2px solid var(--pumpkin);border-radius:14px;padding:10px 18px;z-index:50;max-width:88vw;text-align:center}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tape .run,.show{animation:none}.diagram .str.new{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";
/* ===================== config ===================== */
const _F=/[?&]fast/.test(location.search)&&/[?&]bc/.test(location.search)?0.1:1; // test-only speedup
const RS_MS=60000*_F, BOOK_MS=150000*_F, START_MS=5000*_F, INTRO_MS=5000*_F, MATCH_MS=8000*_F, REVEAL_MS=9000*_F;
const CAPITAL=100, STEP=10;
const PEER_PREFIX='trick-or-trade-v2-';
const TICKERS=['BOO','GHST','PMKN','BATS','FANG','HEX','GOO','SKUL','WTCH','CNDY','MUMY','ZMBI','CRPT','HOWL','EEK','SPDR','CRWS','BREW','COFN','MOON'];
const TAG_SUGGEST=['#會發光','#吃的','#實用','#療癒','#搞笑','#毛茸茸','#香香的','#很重'];
const QUICK_Q=['Can I eat it?','Can I wear it?','Is it useful?','Is it a joke gift?','Bigger than a phone?','Is it heavy?','Does it need batteries?','Is it handmade?','Is it cute?','For daily use?','For the home?','Does it smell nice?','Is it fragile?','Would you keep it?'];
const ANSWERS=[['Yes','yes'],['No','no'],['Kinda','kinda']];

const params=new URLSearchParams(location.search);
const TEST=params.has('bc');
const BASE=location.href.split('?')[0].split('#')[0];

/* ===================== helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseTags(str){return [...new Set(String(str).split(/[\s,，、#＃]+/).map(t=>t.trim()).filter(Boolean).map(t=>'#'+t.slice(0,12)))].slice(0,4)}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let toastT;function toast(t,ms){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||2500)}
function setHTML(el,h){if(!el)return;if(el._h!==h){el.innerHTML=h;el._h=h}}
const fmtClock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const short=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
function spark(h,w,ht){
  const a=(h&&h.length?h:[0]).slice(-20);if(a.length===1)a.unshift(a[0]);
  const max=Math.max(10,...a),n=a.length,pts=a.map((v,i)=>((i/(n-1))*(w-4)+2).toFixed(1)+','+(ht-2-(v/max)*(ht-4)).toFixed(1)).join(' ');
  const last=a[n-1],prev=a[n-2],c=last>prev?'#8be04e':last<prev?'#ff4d6a':'#b8a7cc';
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function chg(h){if(!h||h.length<2)return{d:0,cls:'flat',sym:'–'};const d=h[h.length-1]-h[h.length-2];return{d,cls:d>0?'up':d<0?'down':'flat',sym:d>0?'▲':d<0?'▼':'–'}}

/* ===================== sound ===================== */
let AC=null,soundOn=false;
function tone(f,d,type,v,delay){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={bell(){tone(392,1.4,'triangle',.16);tone(587,1.2,'sine',.08,.04)},tick(){tone(880,.06,'square',.04)},string(){tone(220,.5,'sawtooth',.06);tone(330,.6,'triangle',.08,.08)},boo(){tone(180,.9,'sine',.15);tone(140,1.1,'sine',.12,.2)},gong(){for(let i=0;i<3;i++)tone(110+i*55,2,'sine',.12,i*.05)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="sound"]');if(!b)return;soundOn=!soundOn;b.textContent=soundOn?'Sound: on':'Sound: off';if(soundOn)sfx.bell()});

/* ===================== transport ===================== */
function fakeConn(ch,from,to){const h={};return{send(d){ch.postMessage({to,from,kind:'data',data:d})},on(ev,f){(h[ev]=h[ev]||[]).push(f)},_emit(ev,d){(h[ev]||[]).forEach(f=>f(d))},close(){ch.postMessage({to,from,kind:'close'})}}}
const Net={
  host(room,{onConn,onReady,onError}){
    if(TEST){const ch=new BroadcastChannel('tot-'+room),conns={};
      ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;let c=conns[m.from];
        if(m.kind==='close'){if(c){c._emit('close');delete conns[m.from]}return}
        if(!c){c=conns[m.from]=fakeConn(ch,'host',m.from);onConn(c)}c._emit('data',m.data)};
      setTimeout(onReady,0);return null}
    if(!window.Peer){onError({type:'nolib'});return null}
    const peer=new Peer(PEER_PREFIX+room.toLowerCase());
    peer.on('open',onReady);peer.on('connection',c=>{c.on('open',()=>onConn(c))});
    peer.on('error',e=>onError(e,peer));
    peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
    return peer;
  },
  join(room,{onOpen,onData,onClose,onError}){
    if(TEST){const me='c'+uid(),ch=new BroadcastChannel('tot-'+room),c=fakeConn(ch,me,'host');
      ch.onmessage=e=>{const m=e.data;if(m.to===me&&m.kind==='data')onData(m.data)};
      addEventListener('beforeunload',()=>c.close());setTimeout(()=>onOpen(c),30);return}
    if(!window.Peer){onError({type:'nolib'});return}
    const peer=new Peer();let done=false;
    const fail=e=>{if(done)return;done=true;try{peer.destroy()}catch(x){}onError(e||{})};
    peer.on('open',()=>{const c=peer.connect(PEER_PREFIX+room.toLowerCase(),{reliable:true,serialization:'json'});
      c.on('open',()=>onOpen(c));c.on('data',onData);
      c.on('close',()=>{if(done)return;done=true;try{peer.destroy()}catch(x){}onClose()});c.on('error',fail)});
    peer.on('error',fail);peer.on('disconnected',()=>fail({type:'disconnected'}));
  }
};

/* ===================== routing ===================== */
const app=$('#app');
const ROOM=(params.get('room')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
if(ROOM&&params.get('host'))startHosting(ROOM);else if(ROOM)startJoining(ROOM);else landing();

function landing(){
  const saved=store.get('tot-host');
  const canResume=saved&&saved.room&&saved.phase!=='done'&&Date.now()-(saved.created||0)<6*3600e3;
  app.innerHTML=`<div class="wrap landing">
    <div><h1 class="logo">Trick<span class="or">or</span>Trade</h1>
    <p class="muted" style="font-size:17px;margin:10px 0 0">A Halloween gift IPO. List your gift, answer questions, bid in secret, and see who gets what.</p></div>
    <div class="card stack"><div><b>Start a room</b><div class="muted small">Your phone runs the game. Keep this page open until the end.</div></div>
      <button class="btn huge wide" id="hostBtn">Create a room</button>
      ${canResume?`<button class="btn sec wide" id="resumeBtn">Back to room ${esc(saved.room)}</button>`:''}</div>
    <div class="card stack"><label for="codeIn" style="margin:0">Join a room</label>
      <div class="joinrow"><input type="text" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off"><button class="btn" id="joinBtn">Join</button></div>
      <div class="muted small">Or scan the QR code on the host's phone.</div></div></div>`;
  $('#hostBtn').onclick=()=>{store.del('tot-host');go(newCode(),true)};
  if(canResume)$('#resumeBtn').onclick=()=>go(saved.room,true);
  const join=()=>{const c=$('#codeIn').value.toUpperCase().replace(/[^A-Z]/g,'');if(c.length===4)go(c,false);else toast('Room codes are 4 letters.')};
  $('#joinBtn').onclick=join;$('#codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
}
function newCode(){const L='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s}
function go(code,host){location.href=BASE+'?room='+code+(host?'&host=1':'')+(TEST?'&bc=1':'')+(TEST&&params.has('fast')?'&fast=1':'')}

/* =====================================================================
   ENGINE — the market. Runs inside the room creator's page.
   ===================================================================== */
function Engine(room,onSync){
  let S=store.get('tot-host');
  if(!S||S.room!==room)S={room,created:Date.now(),hostPid:'h'+uid()+uid(),phase:'lobby',players:{},ready:{},startAt:0,order:[],rsIdx:0,rsEndsAt:0,qa:[],bookEndsAt:0,orders:{},locked:{},hist:{},alloc:null,matchShown:0,revealShown:0,nextAt:0};
  const listed=()=>Object.keys(S.players).filter(id=>S.players[id].tk).sort((a,b)=>S.players[a].at-S.players[b].at);
  const nm=id=>(S.players[id]&&S.players[id].name)||'???';
  const tkOf=id=>(S.players[id]&&S.players[id].tk)||'???';
  const online=new Set([S.hostPid]);
  let toastTo=()=>{};

  function demand(){const d={};S.order.forEach(g=>d[g]=0);Object.values(S.orders).forEach(o=>Object.keys(o).forEach(g=>{if(d[g]!==undefined)d[g]+=o[g]}));return d}
  function recordPrices(){const d=demand();S.order.forEach(g=>{const h=S.hist[g]=S.hist[g]||[0];if(h[h.length-1]!==d[g]){h.push(d[g]);if(h.length>30)h.shift()}})}

  function handle(pid,m){
    const P=S.players[pid];
    switch(m.t){
      case 'hello':break;
      case 'list':{
        if(S.phase!=='lobby')return;
        let name=String(m.name||'').trim().slice(0,14)||'Ghost';
        const taken=new Set(Object.keys(S.players).filter(id=>id!==pid).map(id=>S.players[id].name));let n=name,k=2;while(taken.has(n))n=name+' '+(k++);
        const tags=(Array.isArray(m.tags)?m.tags:[]).map(t=>String(t).slice(0,13)).slice(0,4);
        let tk=P&&P.tk;if(!tk){const used=new Set(Object.values(S.players).map(p=>p.tk));const free=TICKERS.filter(t=>!used.has(t));tk=free.length?free[Math.floor(Math.random()*free.length)]:'G'+Math.floor(Math.random()*900+100)}
        S.players[pid]={name:n,tags,pitch:String(m.pitch||'').trim().slice(0,80),tk,at:P&&P.at||Date.now()};
        delete S.ready[pid];sfx.tick();break;}
      case 'ready':if(S.phase==='lobby'&&P&&P.tk){if(m.v)S.ready[pid]=true;else delete S.ready[pid]}break;
      case 'ask':{
        if(!S.order.includes(pid)){toastTo(pid,'Only players in this round can ask.');return}
        // accept questions for the gift on stage, plus a 4-second grace period for the gift that just left the stage
        let g=S.order[S.rsIdx];
        if(m.tk&&tkOf(g)!==m.tk){const prev=S.order[S.rsIdx-1];if(S.phase==='roadshow'&&prev&&tkOf(prev)===m.tk&&Date.now()-(S.rsEndsAt-RS_MS)<4000)g=prev;else{toastTo(pid,'Too late, that gift already left the stage.');return}}
        if(S.phase!=='roadshow'&&!(S.phase==='book'&&m.tk&&tkOf(S.order[S.order.length-1])===m.tk&&Date.now()-(S.bookEndsAt-BOOK_MS)<4000)){toastTo(pid,'Questions are closed.');return}
        if(!g||g===pid)return;
        const q=String(m.q||'').trim().slice(0,90);if(!q)return;
        if(S.qa.some(x=>x.g===g&&x.q.toLowerCase()===q.toLowerCase())){toastTo(pid,'Someone already asked that one.');return}
        if(S.qa.filter(x=>x.g===g&&x.by===pid).length>=10){toastTo(pid,'You can ask up to 10 questions per gift.');return}
        S.qa.push({id:uid(),g,by:pid,q,a:null});sfx.tick();toastTo(pid,'Sent anonymously');break;}
      case 'answer':{const it=S.qa.find(x=>x.id===m.qid);if(!it||it.g!==pid||!ANSWERS.some(a=>a[1]===m.a))return;it.a=m.a;break;}
      case 'orders':{
        if(S.phase!=='book'||!S.order.includes(pid)||S.locked[pid])return;
        const byTk=m.ordersTk||{},clean={};let sum=0;
        for(const g of S.order){if(g===pid)continue;const v=Math.max(0,Math.floor(+byTk[tkOf(g)]||0));if(v>0&&sum+v<=CAPITAL){clean[g]=v;sum+=v}}
        S.orders[pid]=clean;recordPrices();break;}
      case 'lock':if(S.phase==='book'&&S.order.includes(pid)){if(m.v)S.locked[pid]=true;else delete S.locked[pid]}break;
      default:return;
    }
    sync();
  }

  function pubView(){
    const ids=S.order.length?S.order:listed(),d=demand();
    const fillPx={};if(S.alloc)S.alloc.steps.slice(0,S.matchShown).forEach(s=>{if(s.type!=='freeze')fillPx[s.g]=s.a||0});
    const pv={room:S.room,phase:S.phase,now:Date.now(),
      players:Object.keys(S.players).filter(id=>S.players[id].tk).sort((a,b)=>S.players[a].at-S.players[b].at).map(id=>({name:S.players[id].name,ready:!!S.ready[id],on:online.has(id)})),
      startAt:S.startAt,rsIdx:S.rsIdx,rsEndsAt:S.rsEndsAt,bookEndsAt:S.bookEndsAt,
      stocks:ids.map(g=>({tk:tkOf(g),tags:S.players[g].tags,pitch:S.players[g].pitch,px:d[g]||0,hist:S.hist[g]||[0],sold:g in fillPx,soldPx:fillPx[g]})),
      qa:S.qa.map(x=>({id:x.id,tk:tkOf(x.g),q:x.q,a:x.a})),
      lockedN:Object.keys(S.locked).length,traders:S.order.length};
    if(S.alloc){
      pv.match=S.alloc.steps.slice(0,S.matchShown).map(s=>({type:s.type,who:nm(s.b),tk:tkOf(s.g),a:s.a||0,tie:!!s.tie,others:(s.others||[]).map(o=>({who:nm(o.b),a:o.a}))}));
      pv.matchTotal=S.alloc.steps.length;
      pv.people=S.order.slice().sort((a,b)=>S.players[a].at-S.players[b].at).map(nm);
      pv.tickers=S.order.map(tkOf);
      pv.reveals=S.alloc.result.slice(0,S.revealShown).map(r=>({tk:tkOf(r.g),tags:S.players[r.g].tags,from:nm(r.g),to:nm(r.b),a:r.a||0}));
      pv.revealTotal=S.alloc.result.length;
    }
    return pv;
  }
  function meView(pid){
    const P=S.players[pid];if(!P)return{listed:false,inGame:false};
    const me={listed:!!P.tk,inGame:S.order.includes(pid),name:P.name,tags:P.tags,pitch:P.pitch,tk:P.tk,ready:!!S.ready[pid],locked:!!S.locked[pid],
      ordersTk:Object.fromEntries(Object.entries(S.orders[pid]||{}).map(([g,v])=>[tkOf(g),v])),
      myQs:S.qa.filter(x=>x.g===pid).map(x=>({id:x.id,q:x.q,a:x.a}))};
    if(S.alloc){
      const r=S.alloc.result.find(x=>x.b===pid),seen=S.alloc.steps.slice(0,S.matchShown).some(s=>s.type!=='freeze'&&s.b===pid);
      if(r&&(seen||S.phase==='reveal'||S.phase==='done'))me.got={tk:tkOf(r.g),tags:S.players[r.g].tags,a:r.a||0};
      const sh=S.alloc.result.slice(0,S.revealShown);const a=sh.find(x=>x.b===pid);if(a)me.from=nm(a.g);const b=sh.find(x=>x.g===pid);if(b)me.gaveTo=nm(b.b);
    }
    return me;
  }
  function sync(){store.set('tot-host',S);onSync()}

  function startRoadshow(){const ids=listed();if(ids.length<2)return;S.order=shuffle(ids.slice());S.rsIdx=0;S.rsEndsAt=Date.now()+RS_MS;S.phase='roadshow';S.startAt=0;S.hist={};S.order.forEach(g=>S.hist[g]=[0]);sfx.bell();sync()}
  function nextStock(){S.rsIdx++;if(S.rsIdx>=S.order.length){S.phase='book';S.bookEndsAt=Date.now()+BOOK_MS;sfx.gong()}else{S.rsEndsAt=Date.now()+RS_MS;sfx.bell()}sync()}
  function closeBook(){S.alloc=allocate();S.matchShown=0;S.phase='match';S.nextAt=Date.now()+INTRO_MS;sfx.gong();sync()}
  function matchNext(){
    if(S.matchShown<S.alloc.steps.length){S.matchShown++;S.alloc.steps[S.matchShown-1].type==='freeze'?sfx.boo():sfx.string();S.nextAt=Date.now()+MATCH_MS}
    else{S.phase='reveal';S.revealShown=0;S.nextAt=Date.now()+INTRO_MS;sfx.gong()}
    sync();
  }
  function revealNext(){
    if(S.revealShown<S.alloc.result.length){S.revealShown++;sfx.string();S.nextAt=Date.now()+REVEAL_MS}
    else{S.phase='done';sfx.bell()}
    sync();
  }

  function allocate(){
    const ids=S.order.slice(),all=[];
    ids.forEach(b=>{const o=S.orders[b]||{};ids.forEach(g=>{if(g!==b&&o[g]>0)all.push({b,g,a:o[g],r:Math.random()})})});
    all.sort((x,y)=>y.a-x.a||x.r-y.r);
    const tB=new Set(),tG=new Set(),steps=[];
    for(const o of all){
      if(tB.has(o.b)||tG.has(o.g))continue;
      const remB=ids.filter(x=>!tB.has(x)&&x!==o.b),remG=ids.filter(x=>!tG.has(x)&&x!==o.g);
      if(remB.length===1&&remB[0]===remG[0]){steps.push({type:'freeze',b:o.b,g:o.g,a:o.a});continue}
      const tie=all.some(p=>p!==o&&p.g===o.g&&p.a===o.a&&!tB.has(p.b));
      tB.add(o.b);tG.add(o.g);
      steps.push({type:'fill',b:o.b,g:o.g,a:o.a,tie,others:all.filter(p=>p.g===o.g&&p.b!==o.b).map(p=>({b:p.b,a:p.a}))});
    }
    const remB=ids.filter(x=>!tB.has(x)),remG=ids.filter(x=>!tG.has(x)),m=matchNoSelf(remB,remG);
    remB.forEach((b,i)=>steps.push({type:'left',b,g:m[i],a:0}));
    return{steps,result:steps.filter(s=>s.type!=='freeze').map(s=>({b:s.b,g:s.g,a:s.a||0}))};
  }
  function matchNoSelf(B,G){
    for(let t=0;t<300;t++){const p=shuffle(G.slice());if(B.every((b,i)=>p[i]!==b))return p}
    const res=[],used=new Set();(function bt(i){if(i===B.length)return true;for(const g of G){if(used.has(g)||g===B[i])continue;used.add(g);res[i]=g;if(bt(i+1))return true;used.delete(g)}return false})(0);
    return res.length===B.length?res:G.slice();
  }

  let lastSec=-1;
  setInterval(()=>{
    const now=Date.now();
    if(S.phase==='lobby'){
      const ids=listed(),all=ids.length>=2&&ids.every(id=>S.ready[id]);
      if(all&&!S.startAt){S.startAt=now+START_MS;sync()}else if(!all&&S.startAt){S.startAt=0;sync()}else if(S.startAt&&now>=S.startAt)startRoadshow();
    }else if(S.phase==='roadshow'){if(now>=S.rsEndsAt)nextStock()}
    else if(S.phase==='book'){const s=Math.ceil((S.bookEndsAt-now)/1000);if(s!==lastSec&&s<=10&&s>0)sfx.tick();lastSec=s;if(now>=S.bookEndsAt||(S.order.length&&S.order.every(id=>S.locked[id])))closeBook()}
    else if(S.phase==='match'&&now>=S.nextAt)matchNext();
    else if(S.phase==='reveal'&&now>=S.nextAt)revealNext();
  },300);

  return{S:()=>S,handle,pubView,meView,hostPid:()=>S.hostPid,setOnline(pid,on){on?online.add(pid):online.delete(pid)},onToast(f){toastTo=f}};
}

/* ===================== host: engine + network + its own player UI ===================== */
function startHosting(room){
  let E=null,ui=null;const conns=new Map();
  E=Engine(room,()=>{if(!E)return;const pub=E.pubView();conns.forEach((c,pid)=>{try{c.send({t:'view',pub,me:E.meView(pid)})}catch(e){}});ui&&ui.view({pub,me:E.meView(E.hostPid())})});
  E.onToast((pid,t)=>{if(pid===E.hostPid())toast(t);else{const c=conns.get(pid);if(c){try{c.send({t:'toast',text:t})}catch(e){}}}});
  const me=E.hostPid();
  ui=PlayerUI(room,{send:m=>E.handle(me,m),isHost:true});
  ui.setOnline(false,'Opening the room…');
  E.handle(me,{t:'hello'});
  function connect(attempt){
    Net.host(room,{
      onReady(){ui.setOnline(true)},
      onConn(c){let pid=null;
        c.on('data',m=>{if(!m||typeof m!=='object'||!m.pid)return;const p=String(m.pid).slice(0,40);if(p===me)return;pid=p;conns.set(pid,c);E.setOnline(pid,true);E.handle(pid,m)});
        c.on('close',()=>{if(pid&&conns.get(pid)===c){conns.delete(pid);E.setOnline(pid,false);E.handle(me,{t:'hello'})}})},
      onError(e,peer){
        if(e&&e.type==='unavailable-id'){try{peer&&peer.destroy()}catch(x){}ui.setOnline(false,'Reopening room '+room+'…');if((attempt||0)<20)setTimeout(()=>connect((attempt||0)+1),3000);else toast('Room '+room+' is busy. Go back and create a new room.',8000);return}
        if(e&&e.type==='nolib'){ui.setOnline(false,'Could not load the connection library. Check the internet.');return}
      }
    });
  }
  connect(0);
  let lock=null;async function wake(){try{if('wakeLock' in navigator&&document.visibilityState==='visible')lock=await navigator.wakeLock.request('screen')}catch(e){}}
  wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();E.handle(me,{t:'hello'})}});
  addEventListener('beforeunload',e=>{const p=E.S().phase;if(p!=='lobby'&&p!=='done'){e.preventDefault();e.returnValue=''}});
}
function startJoining(room){
  const KEY='tot-pid-'+room;
  let pid=(TEST&&params.get('pid'))||store.get(KEY);if(!pid){pid='p'+uid()+uid();store.set(KEY,pid)}
  let conn=null,retryT=0;
  const ui=PlayerUI(room,{send:m=>{if(conn){try{conn.send(Object.assign({pid},m))}catch(e){}}else toast('Reconnecting… try again in a second.')},isHost:false});
  function connect(){
    Net.join(room,{
      onOpen(c){conn=c;ui.setOnline(true);c.send({t:'hello',pid})},
      onData(m){if(m&&m.t==='view')ui.view(m);else if(m&&m.t==='toast')toast(m.text)},
      onClose(){conn=null;ui.setOnline(false,'Reconnecting…');clearTimeout(retryT);retryT=setTimeout(connect,2000)},
      onError(e){conn=null;ui.setOnline(false,e&&e.type==='peer-unavailable'?'Room '+room+' not found. Is the host’s page open?':e&&e.type==='nolib'?'Could not load the connection library.':'Reconnecting…');clearTimeout(retryT);retryT=setTimeout(connect,2500)}
    });
  }
  connect();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!conn){clearTimeout(retryT);connect()}});
}

/* =====================================================================
   PLAYER UI — the same on every phone (the host just has a banner)
   ===================================================================== */
function PlayerUI(room,{send,isHost}){
  let V=null,offset=0,online=false,status='',lastKey='',editing=false,draft=null,draftT=0,ownQ=false;
  const joinURL=BASE+'?room='+room+(TEST?'&bc=1':'')+(TEST&&params.has('fast')?'&fast=1':'');

  app.innerHTML=`${isHost?`<div class="hostbar"><div class="wrap">You are hosting room <b>${esc(room)}</b>. Keep this page open and your screen on.</div></div>`:''}
    <div class="wrap"><div class="head"><div class="logo">Trick<span class="or">or</span>Trade</div><span class="pill" id="pill"><span class="dot"></span><span id="pillTxt"></span></span></div></div>
    <div class="tape" id="tape"></div>
    <div class="wrap"><div id="prog"></div><main id="pbody" class="stack"></main>
      <div class="muted center small" id="pstatus"></div><div class="center" style="padding-bottom:24px"><button class="btn sec" data-act="sound" style="padding:8px 14px;font-size:14px">Sound: off</button></div></div>`;

  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-p]');if(!b||b.disabled)return;const a=b.dataset.p;
    if(a==='chip'){const t=$('#tagIn');let cur=parseTags(t.value);const v=b.dataset.v;cur=cur.includes(v)?cur.filter(x=>x!==v):cur.length<4?cur.concat(v):cur;t.value=cur.join(' ');syncChips();return}
    if(a==='edit'){editing=true;lastKey='';render();return}
    if(a==='ready'){send({t:'ready',v:!V.me.ready});return}
    if(a==='q'){send({t:'ask',q:b.dataset.v,tk:V.pub.stocks[V.pub.rsIdx].tk});return}
    if(a==='ownq'){ownQ=!ownQ;lastKey='';render();return}
    if(a==='askfree'){const i=$('#qIn'),q=i.value.trim();if(!q)return;send({t:'ask',q,tk:V.pub.stocks[V.pub.rsIdx].tk});i.value='';return}
    if(a==='ans'){send({t:'answer',qid:b.dataset.q,a:b.dataset.v});return}
    if(a==='pm'){
      if(V.me.locked)return;draft=draft||Object.assign({},V.me.ordersTk);
      const tk=b.dataset.tk,d=+b.dataset.d,cur=draft[tk]||0,left=CAPITAL-Object.values(draft).reduce((s,v)=>s+v,0);
      draft[tk]=Math.max(0,Math.min(cur+d,cur+left));renderBids();clearTimeout(draftT);draftT=setTimeout(()=>send({t:'orders',ordersTk:draft}),300);return}
    if(a==='lock'){clearTimeout(draftT);if(draft)send({t:'orders',ordersTk:draft});setTimeout(()=>send({t:'lock',v:true}),draft?150:0);return}
    if(a==='unlock'){send({t:'lock',v:false});return}
    if(a==='showqr'){const q=$('#qrBox');q.hidden=!q.hidden;if(!q.hidden&&!q._done&&window.QRCode){q._done=true;try{new QRCode($('#qr'),{text:joinURL,width:180,height:180,colorDark:'#120b1a',colorLight:'#f6eddc'})}catch(err){}}b.textContent=q.hidden?'Show QR code':'Hide QR code';return}
  });
  app.addEventListener('input',e=>{if(e.target.id==='tagIn')syncChips()});
  app.addEventListener('submit',e=>{
    if(e.target.id!=='listForm')return;e.preventDefault();
    const name=$('#nameIn').value.trim(),tags=parseTags($('#tagIn').value),pitch=$('#pitchIn').value.trim();
    if(!name){toast('Add your name.');$('#nameIn').focus();return}
    if(!tags.length){toast('Pick or type at least one hashtag.');$('#tagIn').focus();return}
    store.set('tot-last-name',name);editing=false;lastKey='';send({t:'list',name,tags,pitch});
  });
  app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qIn'){e.preventDefault();$('[data-p="askfree"]').click()}});
  function syncChips(){const t=$('#tagIn');if(!t)return;const cur=parseTags(t.value);document.querySelectorAll('[data-p="chip"]').forEach(c=>c.classList.toggle('on',cur.includes(c.dataset.v)))}

  function renderTape(){
    const el=$('#tape');const P=V&&V.pub;
    if(!P||!P.stocks.length){setHTML(el,'<div class="run" style="--dur:22s"><span class="it flat">TRICK OR TRADE EXCHANGE · MARKET OPENS SOON · LIST YOUR GIFT ·</span><span class="it flat">TRICK OR TRADE EXCHANGE · MARKET OPENS SOON · LIST YOUR GIFT ·</span></div>');return}
    const live=['book','match','reveal','done'].includes(P.phase);
    let one=P.stocks.map(s=>{
      if(s.sold)return `<span class="it"><span>$${esc(s.tk)}</span><span class="px">${s.soldPx?'SOLD '+s.soldPx:'LEFTOVER'}</span></span>`;
      if(!live)return `<span class="it"><span>$${esc(s.tk)}</span><span class="flat">IPO</span></span>`;
      const c=chg(s.hist);return `<span class="it"><span>$${esc(s.tk)}</span><span class="px">${s.px}</span><span class="${c.cls}">${c.sym}${c.d?Math.abs(c.d):''}</span></span>`}).join('');
    let n=1;while(P.stocks.length*n<8)n++;one=one.repeat(n);
    const dur=Math.max(18,P.stocks.length*n*3.2);
    setHTML(el,`<div class="run" style="--dur:${dur}s">${one}${one}</div>`);
  }
  const STEPS=[['lobby','List'],['roadshow','Q&A'],['book','Bid'],['match','Match'],['reveal','Reveal']];
  function progress(ph){const idx={lobby:0,roadshow:1,book:2,match:3,reveal:4,done:4}[ph]??0;
    return `<div class="steps">${STEPS.map((s,i)=>`<div class="${i<idx?'done':i===idx?'now':''}"></div>`).join('')}</div><div class="stepname">${STEPS.map((s,i)=>i===idx?`<b>${s[1]}</b>`:`<span>${s[1]}</span>`).join('')}</div>`}

  function render(){
    $('#pill').classList.toggle('off',!online);
    setHTML($('#pillTxt'),V&&V.me.listed?esc(V.me.name)+' · $'+esc(V.me.tk):'Room '+esc(room));
    setHTML($('#pstatus'),online?'':esc(status||'Connecting…'));
    renderTape();
    const body=$('#pbody');
    if(!V){setHTML($('#prog'),'');if(lastKey!=='wait'){lastKey='wait';body.innerHTML=`<div class="center" style="padding-top:40px"><div class="bigword">Boo.</div><p class="muted">Connecting to room ${esc(room)}…</p></div>`}return}
    const ph=V.pub.phase,me=V.me;
    setHTML($('#prog'),progress(ph));
    let key=ph;
    if(ph==='lobby')key+=me.listed&&!editing?':wait':':form';
    else if(!me.inGame&&(ph==='roadshow'||ph==='book'))key='spectator';
    else if(ph==='roadshow'){const mine=V.pub.stocks[V.pub.rsIdx].tk===me.tk;key+=':'+V.pub.rsIdx+(mine?':mine':':ask'+(ownQ?1:0))}
    else if(ph==='book')key+=me.locked?':locked':':open';
    else if(ph==='done')key='reveal';
    if(key!==lastKey){body.innerHTML='';body._h=null;lastKey=key;build(body,key)}
    update(key);
  }

  function build(body,key){
    const me=V.me;
    if(key==='spectator'){body.innerHTML=`<div class="center" style="padding-top:30px"><div class="bigword">Too late</div><p class="muted">This round already started. You can watch the matching and the reveal here.</p></div>`;return}
    if(key==='lobby:form'){const p=me.listed?me:{};
      body.innerHTML=`<div><h2 class="title">List your gift</h2><p class="sub">Nobody will know it’s yours until the end.</p></div>
      <form class="card" id="listForm" autocomplete="off">
        <div class="field"><label for="nameIn">Your name</label><input type="text" id="nameIn" maxlength="14" value="${esc(p.name||store.get('tot-last-name')||'')}" placeholder="e.g. Pumpkin Pete"></div>
        <div class="field"><label for="tagIn">Describe your gift with hashtags</label><input type="text" id="tagIn" maxlength="60" value="${esc((p.tags||[]).join(' '))}" placeholder="Tap below or type your own">
          <div class="chips">${TAG_SUGGEST.map(t=>`<button type="button" class="chip" data-p="chip" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
        <div class="field" style="margin-bottom:20px"><label for="pitchIn">Sales pitch <span class="opt">(optional)</span></label><input type="text" id="pitchIn" maxlength="80" value="${esc(p.pitch||'')}" placeholder="Your winter will thank you."></div>
        <button class="btn huge wide" type="submit">List my gift</button></form>${inviteHTML()}`;syncChips();return}
    if(key==='lobby:wait'){body.innerHTML=`<div class="stock center"><div class="muted">Your gift is listed as</div><div class="tk" style="margin-top:4px">$${esc(me.tk)}</div><div class="htags">${esc(me.tags.join(' '))}</div></div>
      <div id="waitInfo" class="center stack"></div>${inviteHTML()}<div class="bottom"><button class="btn huge wide" data-p="ready" id="readyBtn"></button><div class="center"><button class="link" data-p="edit">Edit my gift</button></div></div>`;return}
    if(key.endsWith(':mine')){body.innerHTML=`<div class="stock" id="rsCard"></div><div class="card answer"><div style="font-size:19px;font-weight:700">This is your gift</div><div class="muted">Answer every question. Keep a straight face.</div></div><div id="ansList" class="stack"></div>`;return}
    if(key.startsWith('roadshow')){
      body.innerHTML=`<div class="stock" id="rsCard"></div><div class="stack" style="gap:8px"><div style="font-weight:700;font-size:18px">Ask the owner</div><div class="muted small">Anonymous. Tap a question to send it.</div>
        ${ownQ?`<div class="inrow"><input type="text" id="qIn" maxlength="90" placeholder="Type a yes / no question"><button class="btn" data-p="askfree">Ask</button></div><div class="center"><button class="link" data-p="ownq">Back to the question list</button></div>`
        :`<div class="qgrid" id="qgrid"></div><div class="center"><button class="link" data-p="ownq">Write my own question</button></div>`}</div>
        <div id="ansList" class="stack"></div><div class="stack" style="gap:8px"><div style="font-weight:700">Answers so far</div><div class="list" id="rsFeed"></div></div>`;
      if(ownQ)setTimeout(()=>{const i=$('#qIn');i&&i.focus()},50);return}
    if(key==='book:open'){body.innerHTML=`<div><h2 class="title">Bid in secret</h2><p class="sub">Spend up to 100 candy. Each gift’s market price is the total candy everyone has bid on it. The highest single bid gets matched first.</p></div>
      <div class="sticky row2"><div><div class="muted small">Your candy left</div><div class="candy" id="left"></div></div><div style="text-align:right"><div class="muted small">Closes in</div><div class="tk" id="btimer" style="color:var(--candy);font-size:18px"></div></div></div>
      <div id="bids" class="stack" style="gap:10px"></div><div id="ansList" class="stack"></div>
      <div class="bottom"><button class="btn huge wide" data-p="lock" id="lockBtn">Lock in my bids</button></div>`;return}
    if(key==='book:locked'){body.innerHTML=`<div class="center" style="padding-top:8px"><div class="bigword">Locked in</div><p class="muted" id="lockInfo"></p></div><div class="card" id="mySummary"></div>
      <div class="stack" style="gap:8px"><div style="font-weight:700">Market</div><div class="list" id="mktList"></div></div><div id="ansList" class="stack"></div>
      <div class="bottom"><button class="btn sec wide" data-p="unlock">Change my bids</button></div>`;return}
    if(key==='match'){body.innerHTML=`<div id="mine"></div><div id="showCard"></div><div class="diagram" id="strings"></div><div class="stack" style="gap:8px"><div style="font-weight:700">Matches</div><div class="list" id="feed"></div></div>`;return}
    if(key==='reveal'){body.innerHTML=`<div id="showCard"></div><div class="diagram" id="circle"></div><div id="mine" class="stack"></div><div class="stack" style="gap:8px"><div style="font-weight:700">Who gave what</div><div class="list" id="feed"></div></div>`;return}
  }
  function inviteHTML(){return `<div class="card center stack" style="gap:8px"><div class="muted small">Invite others with this code</div><div class="code">${esc(room)}</div><div><button class="link" data-p="showqr">Show QR code</button></div><div id="qrBox" hidden><div class="qr" id="qr"></div></div></div>`}

  function update(key){
    const P=V.pub,me=V.me,now=Date.now()+offset;
    if(key==='lobby:wait'){
      const n=P.players.filter(p=>p.ready).length;
      setHTML($('#waitInfo'),P.startAt?`<div class="count" id="startCount">${Math.max(0,Math.ceil((P.startAt-now)/1000))}</div><div class="muted">Opening bell…</div>`
        :`<div style="font-size:18px;font-weight:600">${n} of ${P.players.length} ready</div><div class="who">${P.players.map(p=>`<span class="${p.ready?'ready':''}">${esc(p.name)}</span>`).join('')}</div><div class="muted small">${P.players.length<2?'Waiting for at least one more player.':'The game starts when everyone taps I’m ready.'}</div>`);
      const b=$('#readyBtn');b.className='btn huge wide'+(me.ready?' ok':'');b.textContent=me.ready?'Ready (tap to undo)':'I’m ready';
    }
    if(key.startsWith('roadshow')){
      const s=P.stocks[P.rsIdx];
      setHTML($('#rsCard'),`<div class="row2 muted small"><span>Gift ${P.rsIdx+1} of ${P.stocks.length}</span><span class="tk" id="rtimer" style="color:var(--candy)"></span></div><div class="tk" style="margin-top:6px">$${esc(s.tk)}</div><div class="htags">${esc(s.tags.join(' '))}</div>${s.pitch?`<div class="pitch">“${esc(s.pitch)}”</div>`:''}<div class="bar"><i id="rbar"></i></div>`);
      const qg=$('#qgrid');if(qg){const askedHere=new Set(P.qa.filter(x=>x.tk===s.tk).map(x=>x.q));setHTML(qg,QUICK_Q.map(q=>`<button class="qbtn" data-p="q" data-v="${esc(q)}" ${askedHere.has(q)?'disabled':''}>${esc(q)}</button>`).join(''))}
      const qs=P.qa.filter(x=>x.tk===s.tk).slice().reverse();
      setHTML($('#rsFeed'),qs.length?qs.map(x=>`<div class="qa"><div class="q">${esc(x.q)}</div>${ansHTML(x.a)}</div>`).join(''):'<div class="muted">No questions yet.</div>');
    }
    if($('#ansList'))renderAnswers();
    if(key==='book:open')renderBids();
    if(key==='book:locked'){
      setHTML($('#lockInfo'),`${P.lockedN} of ${P.traders} locked in. Bidding ends when everyone locks in or time runs out.`);
      const o=Object.entries(me.ordersTk).filter(([,v])=>v>0);
      setHTML($('#mySummary'),o.length?`<div class="muted small" style="margin-bottom:6px">Your bids</div>`+o.map(([t,v])=>`<div class="row2" style="font-size:18px"><span class="tk" style="color:var(--pumpkin)">$${esc(t)}</span><b>${v}</b></div>`).join(''):'<div class="muted">You didn’t bid on anything, so you’ll get a gift nobody won.</div>');
      setHTML($('#mktList'),P.stocks.map(s=>mktRow(s,s.tk===me.tk)).join(''));
    }
    if(key==='match')renderMatch();
    if(key==='reveal')renderReveal();
    tick();
  }
  const ansHTML=a=>{const f=ANSWERS.find(x=>x[1]===a);return f?`<div class="a ${a}">${f[0]}</div>`:'<div class="a wait">waiting for the owner…</div>'};
  function mktRow(s,mine){const c=chg(s.hist);return `<div class="lrow"><div class="l"><span class="tk">$${esc(s.tk)}</span>${mine?' <span class="muted small">(yours)</span>':''}</div><div class="r" style="display:flex;gap:8px;align-items:center">${spark(s.hist,64,22)}<span>${s.px}</span><span class="${c.cls}">${c.sym}</span></div></div>`}
  function renderAnswers(){
    const el=$('#ansList');if(!el)return;const open=V.me.myQs.filter(q=>!q.a),ids=open.map(q=>q.id).join(',');
    const mine=lastKey.endsWith(':mine');
    if(el._ids===ids&&el._mine===mine)return;el._ids=ids;el._mine=mine;
    el.innerHTML=open.length?(mine?'':'<div style="font-weight:700">Questions about your gift</div>')+open.map(q=>`<div class="qa answer"><div class="q" style="font-size:18px">${esc(q.q)}</div><div class="abtns">${ANSWERS.map(a=>`<button data-p="ans" data-q="${esc(q.id)}" data-v="${a[1]}">${a[0]}</button>`).join('')}</div></div>`).join('')
      :(mine?'<div class="muted center">No questions yet. They’re coming.</div>':'');
  }
  function renderBids(){
    const P=V.pub,me=V.me,el=$('#bids');if(!el)return;
    const d=draft||me.ordersTk,used=Object.values(d).reduce((s,v)=>s+v,0),left=CAPITAL-used;
    const L=$('#left');L.textContent=left;L.classList.toggle('zero',left===0);
    const rows=P.stocks.filter(s=>s.tk!==me.tk).map(s=>{const v=d[s.tk]||0,c=chg(s.hist);return `<div class="bid ${v?'has':''}"><div style="min-width:0"><div class="tk">$${esc(s.tk)}</div><div class="t">${esc(s.tags.join(' '))}</div></div>
      <div class="pm"><button data-p="pm" data-tk="${esc(s.tk)}" data-d="-${STEP}" ${v<=0?'disabled':''} aria-label="Bid 10 less">−</button><span class="v ${v?'has':''}">${v}</span><button data-p="pm" data-tk="${esc(s.tk)}" data-d="${STEP}" ${left<=0?'disabled':''} aria-label="Bid 10 more">+</button></div>
      <div class="mkt"><span class="lbl">Market</span>${spark(s.hist,90,24)}<span>${s.px}</span><span class="${c.cls}">${c.sym}${c.d?Math.abs(c.d):''}</span></div></div>`});
    const mine=P.stocks.find(s=>s.tk===me.tk);
    if(mine){const c=chg(mine.hist);rows.push(`<div class="bid mine"><div style="min-width:0"><div class="tk">$${esc(mine.tk)}</div><div class="t">${esc(mine.tags.join(' '))}</div></div><div class="muted small">Your gift</div><div class="mkt"><span class="lbl">Market</span>${spark(mine.hist,90,24)}<span>${mine.px}</span><span class="${c.cls}">${c.sym}${c.d?Math.abs(c.d):''}</span></div></div>`)}
    setHTML(el,rows.join(''));
    $('#lockBtn').textContent=used?'Lock in my bids':'Lock in without bidding';
  }
  function stringsSVG(P){
    const people=P.people,tks=P.tickers,n=people.length,rowH=50,H=n*rowH+20,y=i=>20+i*rowH+rowH/2-10;
    const shown=P.match,fills=shown.filter(s=>s.type!=='freeze'),done=shown.length>=P.matchTotal;
    const pB=new Set(fills.map(s=>s.who)),pG=new Set(fills.map(s=>s.tk));let svg='';
    shown.forEach((s,i)=>{const y1=y(people.indexOf(s.who)),y2=y(tks.indexOf(s.tk)),d=`M128 ${y1} C 180 ${y1}, 180 ${y2}, 232 ${y2}`;
      if(s.type==='freeze'){if(i===shown.length-1)svg+=`<path class="frz" d="${d}"/>`}else svg+=`<path class="str ${i===shown.length-1?'new':''}" d="${d}"/>`});
    people.forEach((p,i)=>{svg+=`<text x="118" y="${y(i)+5}" text-anchor="end" font-size="15" class="${pB.has(p)||done?'':'dim'}">${esc(short(p,7))}</text><circle cx="128" cy="${y(i)}" r="5" fill="#f6eddc"/>`});
    tks.forEach((t,i)=>{svg+=`<circle cx="232" cy="${y(i)}" r="5" fill="#ff7a1a"/><text x="242" y="${y(i)+5}" font-size="13" class="tkt ${pG.has(t)||done?'':'dim'}">$${esc(t)}</text>`});
    return `<svg viewBox="0 0 340 ${H}" role="img" aria-label="Who is matched to which gift">${svg}</svg>`;
  }
  function renderMatch(){
    const P=V.pub,me=V.me,shown=P.match||[],last=shown[shown.length-1];
    setHTML($('#mine'),me.got?`<div class="card result" style="border-color:var(--up)"><div class="muted">You got</div><div class="tk">$${esc(me.got.tk)}</div><div class="htags">${esc(me.got.tags.join(' '))}</div><div class="muted" style="margin-top:4px">${me.got.a?'for '+me.got.a+' candy':'a gift nobody won'}</div></div>`:'');
    let c;
    if(!last)c=`<div class="show neutral"><div class="lab">MATCHING</div><div class="main">Bidding is closed.</div><div class="note">The highest single bid gets matched first. Everyone gets exactly one gift, never their own.</div></div>`;
    else if(last.type==='fill')c=`<div class="show"><div class="lab">MATCH ${shown.filter(s=>s.type!=='freeze').length} OF ${P.people.length}${last.tie?' · TIE, DECIDED BY DICE':''}</div><div class="main">${esc(last.who)} gets <span class="tk">$${esc(last.tk)}</span></div><div class="price">${last.a} candy</div>${last.others.length?`<div class="note">Outbid: ${last.others.map(o=>esc(o.who)+' '+o.a).join(', ')}</div>`:''}</div>`;
    else if(last.type==='freeze')c=`<div class="show neutral"><div class="lab">ORDER FROZEN</div><div class="main">${esc(last.who)} on <span class="tk">$${esc(last.tk)}</span> at ${last.a}</div><div class="note">This would leave someone holding their own gift, so it’s skipped.</div></div>`;
    else c=`<div class="show"><div class="lab">LEFTOVER</div><div class="main">${esc(last.who)} gets <span class="tk">$${esc(last.tk)}</span></div><div class="note">No winning bid, so a gift nobody won goes to ${esc(last.who)}.</div></div>`;
    setHTML($('#showCard'),c);
    setHTML($('#strings'),stringsSVG(P));
    setHTML($('#feed'),shown.filter(s=>s.type!=='freeze').slice().reverse().map(s=>`<div class="lrow ${s.who===me.name?'me':''}"><div class="l">${esc(s.who)} · <span class="tk">$${esc(s.tk)}</span></div><div class="r">${s.a?s.a+' candy':'leftover'}</div></div>`).join('')||'<div class="muted">First match in a few seconds…</div>');
  }
  function circleSVG(P){
    const ppl=P.people,n=ppl.length,cx=170,cy=165,R=118,pos={};
    ppl.forEach((p,i)=>{const t=-Math.PI/2+i*2*Math.PI/n;pos[p]={x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)}});
    const lit=new Set();P.reveals.forEach(r=>{lit.add(r.from);lit.add(r.to)});let g='';
    P.reveals.forEach((r,i)=>{const a=pos[r.from],b=pos[r.to];if(!a||!b)return;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,qx=mx-dy*.22,qy=my+dx*.22;
      const ua=Math.hypot(qx-a.x,qy-a.y)||1,sx=a.x+(qx-a.x)/ua*34,sy=a.y+(qy-a.y)/ua*34,ub=Math.hypot(b.x-qx,b.y-qy)||1,ex=b.x-(b.x-qx)/ub*36,ey=b.y-(b.y-qy)/ub*36;
      g+=`<path class="str ${i===P.reveals.length-1?'new':''}" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" marker-end="url(#ah)"/>`});
    ppl.forEach(p=>{const q=pos[p];g+=`<circle class="node ${lit.has(p)?'lit':''}" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="30"/><text x="${q.x.toFixed(1)}" y="${(q.y+5).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600">${esc(short(p,5))}</text>`});
    return `<svg viewBox="0 0 340 330" role="img" aria-label="Who gave a gift to whom"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3a5c"/></marker></defs>${g}</svg>`;
  }
  function renderReveal(){
    const P=V.pub,me=V.me,R=P.reveals||[],last=R[R.length-1],done=P.phase==='done';
    setHTML($('#showCard'),done?`<div class="show center"><div class="bigword">Happy Halloween</div><div class="note">Everyone, go open your gift.</div></div>`
      :last?`<div class="show"><div class="lab">REVEAL ${R.length} OF ${P.revealTotal}</div><div class="main"><span class="tk">$${esc(last.tk)}</span> came from ${esc(last.from)}</div><div class="note">${esc(last.tags.join(' '))}</div><div class="main" style="font-size:20px">${esc(last.from)} → ${esc(last.to)}</div><div class="price">${last.a?last.a+' candy':'leftover'}</div></div>`
      :`<div class="show neutral"><div class="lab">THE REVEAL</div><div class="main">Who brought what?</div><div class="note">Every gift’s owner, one at a time.</div></div>`);
    setHTML($('#circle'),circleSVG(P));
    setHTML($('#mine'),me.got?`<div class="card result"><div class="muted">You got</div><div class="tk">$${esc(me.got.tk)}</div><div class="htags">${esc(me.got.tags.join(' '))}</div><div class="from">${me.from?`from <b>${esc(me.from)}</b>`:'<span class="muted">from … (coming up)</span>'}</div></div>
      <div class="card row2"><span class="muted">Your $${esc(me.tk||'')} went to</span><b style="font-size:19px">${me.gaveTo?esc(me.gaveTo):'…'}</b></div>`:'');
    setHTML($('#feed'),R.slice().reverse().map(r=>`<div class="lrow ${r.to===me.name?'me':''}"><div class="l">${esc(r.from)} → ${esc(r.to)}</div><div class="r">${r.a?r.a+' candy':'leftover'}</div><div class="s"><span class="tk">$${esc(r.tk)}</span> ${esc(r.tags.join(' '))}</div></div>`).join('')||'<div class="muted">First reveal in a few seconds…</div>');
  }
  function tick(){
    if(!V)return;const now=Date.now()+offset,P=V.pub;
    if(P.phase==='roadshow'){const left=P.rsEndsAt-now,t=$('#rtimer'),b=$('#rbar');if(t)t.textContent=fmtClock(left);if(b){b.style.width=Math.max(0,Math.min(100,left/RS_MS*100))+'%';b.parentElement.classList.toggle('urgent',left<10000)}}
    if(P.phase==='book'){const t=$('#btimer');if(t)t.textContent=fmtClock(P.bookEndsAt-now)}
    if(P.phase==='lobby'&&P.startAt){const c=$('#startCount');if(c)c.textContent=Math.max(0,Math.ceil((P.startAt-now)/1000))}
  }
  setInterval(tick,250);

  return{
    view(m){offset=isHost?0:(m.pub.now||Date.now())-Date.now();V=m;if(V.pub.phase!=='book')draft=null;render()},
    setOnline(on,msg){online=on;status=msg||'';render()}
  };
}
})();
</script>
</body>
</html>

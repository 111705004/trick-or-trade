<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trick or Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&family=Rubik+Mono+One&display=swap">
<style>
/* Trick or Trade — a haunted stock exchange. Big screen = trading floor (display only), phones = one-button terminals. */
:root{
  --void:#120b1a; --grave:#1c1228; --tomb:#291b39; --line:#463160;
  --bone:#f6eddc; --mist:#b8a7cc; --pumpkin:#ff7a1a; --candy:#ffd23f; --slime:#8be04e; --blood:#ff3a5c;
  --f-logo:"Creepster","Fredoka",cursive;
  --f-ui:"Fredoka","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-tick:"Rubik Mono One","Fredoka",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--bone);font-family:var(--f-ui);font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));overflow-x:hidden;
  background:radial-gradient(80vmax 50vmax at 100% 0%,rgba(255,122,26,.13),transparent 60%),radial-gradient(70vmax 60vmax at 0% 100%,rgba(139,224,78,.07),transparent 60%),var(--void);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--candy);outline-offset:3px}

.logo{font-family:var(--f-logo);font-weight:400;letter-spacing:.02em;line-height:.95;margin:0;color:var(--pumpkin);text-shadow:0 0 30px rgba(255,122,26,.35)}
.logo .or{color:var(--bone);font-size:.6em;vertical-align:.2em;margin:0 .15em}
.tk{font-family:var(--f-tick);letter-spacing:-.02em}
.muted{color:var(--mist)}
.htags{color:var(--candy);font-weight:600;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 20px;font-size:19px;font-weight:600;
  background:var(--pumpkin);color:#1a0a00;box-shadow:0 4px 0 #a8460a,0 10px 30px -10px rgba(255,122,26,.8);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8460a}
.btn[disabled]{background:var(--tomb);color:var(--mist);box-shadow:none;cursor:not-allowed}
.btn.sec{background:var(--tomb);color:var(--bone);box-shadow:0 4px 0 #0b0610}
.btn.ok{background:var(--slime);color:#0d1a05;box-shadow:0 4px 0 #4f8a26}
.btn.wide{width:100%}
.btn.huge{font-size:22px;padding:18px 20px}
.link{background:none;border:0;padding:6px;color:var(--mist);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.card{background:var(--grave);border:2px solid var(--line);border-radius:22px;padding:18px}
input[type=text]{width:100%;background:var(--void);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:18px}
input[type=text]:focus{border-color:var(--pumpkin);outline:none}
label{display:block;font-weight:600;margin:0 0 6px}
.field{margin-bottom:16px}
.opt{font-weight:400;color:var(--mist);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:15px;color:var(--mist)}
.chip.on{border-color:var(--pumpkin);color:var(--candy);background:rgba(255,122,26,.12)}

/* ---------- landing ---------- */
.landing{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:24px;padding-block:32px}
.landing .logo{font-size:clamp(64px,18vw,108px)}
.joinrow{display:flex;gap:10px}
.joinrow input{text-transform:uppercase;font-family:var(--f-tick);font-size:22px;letter-spacing:.1em;text-align:center}

/* ---------- phone ---------- */
.phone{max-width:480px;margin:0 auto;padding-block:14px 32px;display:flex;flex-direction:column;gap:16px;min-height:100vh}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph-head .logo{font-size:28px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--tomb);border-radius:999px;padding:4px 12px;font-size:14px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--slime);flex:none}
.pill.off .dot{background:var(--blood)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps div{height:6px;border-radius:3px;background:var(--tomb)}
.steps div.done{background:var(--mist)} .steps div.now{background:var(--pumpkin)}
.stepname{display:flex;justify-content:space-between;font-size:14px;color:var(--mist);margin-top:-8px}
.stepname b{color:var(--bone);font-weight:600}
.title{font-size:26px;font-weight:700;line-height:1.2;margin:0}
.sub{color:var(--mist);margin:4px 0 0}
.stock{background:linear-gradient(160deg,var(--tomb),var(--grave));border:2px solid var(--pumpkin);border-radius:22px;padding:18px;overflow:hidden}
.stock .tk{font-size:40px;color:var(--pumpkin);line-height:1}
.stock .htags{font-size:19px;margin-top:8px}
.stock .pitch{font-size:17px;margin-top:6px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--tomb);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--candy);border-radius:4px;transition:width .25s linear}
.bar.urgent i{background:var(--blood)}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{border:2px solid var(--line);background:var(--grave);border-radius:16px;padding:14px 10px;font-size:16px;font-weight:600;min-height:64px}
.qbtn:active{border-color:var(--pumpkin)}
.feedmini{display:flex;flex-direction:column;gap:8px}
.qa{background:var(--grave);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.qa .q{font-weight:600;overflow-wrap:anywhere}
.qa .a{color:var(--slime);overflow-wrap:anywhere}
.qa .a.wait{color:var(--mist);font-style:italic}
.answer{border-color:var(--pumpkin)}
.abtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.abtns button{border:2px solid var(--line);background:var(--tomb);border-radius:12px;padding:10px 4px;font-weight:600;font-size:15px}
.inrow{display:flex;gap:8px;margin-top:8px}
.inrow input{flex:1;min-width:0;font-size:16px;padding:10px 12px}
.inrow .btn{padding:10px 16px;font-size:16px}
.candy-left{display:flex;justify-content:space-between;align-items:flex-end;position:sticky;top:0;z-index:5;background:var(--void);padding:8px 0;border-bottom:2px solid var(--line)}
.candy-left .n{font-family:var(--f-tick);font-size:34px;color:var(--candy);line-height:1}
.candy-left .n.zero{color:var(--slime)}
.bid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--grave);border:2px solid var(--line);border-radius:18px;padding:14px}
.bid.has{border-color:var(--candy)}
.bid .tk{font-size:22px;color:var(--pumpkin)}
.bid .t{font-size:15px;color:var(--candy);overflow-wrap:anywhere}
.bid .p{font-size:14px;color:var(--mist);overflow-wrap:anywhere}
.pm{display:flex;align-items:center;gap:6px}
.pm button{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--tomb);font-size:26px;font-weight:700;line-height:1}
.pm button[disabled]{opacity:.3;cursor:not-allowed}
.pm .v{min-width:44px;text-align:center;font-family:var(--f-tick);font-size:22px}
.pm .v.has{color:var(--candy)}
.bottom{position:sticky;bottom:0;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--void) 30%)}
.result{text-align:center;padding:24px 16px}
.result .tk{font-size:46px;color:var(--pumpkin)}
.result .from{font-size:21px;margin-top:12px}
.result .from b{color:var(--blood)}
.feed-row{display:flex;justify-content:space-between;gap:10px;background:var(--grave);border-radius:14px;padding:12px 14px;border:1px solid var(--line);animation:pop .35s ease-out}
.feed-row .tk{color:var(--pumpkin)}
.feed-row.me{border-color:var(--slime)}
.feed-row.frz{opacity:.6}
.center{text-align:center}
.bigtk{font-family:var(--f-logo);font-size:48px;color:var(--pumpkin);line-height:1}
.count{font-family:var(--f-tick);font-size:64px;color:var(--candy);line-height:1}
@keyframes pop{from{transform:translateY(8px);opacity:0}}

/* ---------- host (display only) ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;gap:18px;padding-block:18px}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.h-top .logo{font-size:clamp(36px,4vw,56px)}
.roomchip{font-family:var(--f-tick);font-size:clamp(18px,2vw,26px);background:var(--tomb);border:2px solid var(--line);border-radius:14px;padding:6px 14px}
.roomchip b{color:var(--candy)}
.phase{font-weight:600;color:var(--mist);font-size:18px}
.tape{overflow:hidden;border-block:2px solid var(--line);background:var(--grave);white-space:nowrap;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.tape .run{display:inline-flex;gap:40px;padding:10px 20px;animation:tape 30s linear infinite}
.tape span{font-family:var(--f-tick);font-size:18px}
.tape .up{color:var(--slime)} .tape .flat{color:var(--mist)}
@keyframes tape{to{transform:translateX(-50%)}}
.h-main{flex:1;display:grid;gap:24px;align-items:start}
.h-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lobby-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr{background:var(--bone);padding:14px;border-radius:18px;line-height:0}
.qr img,.qr canvas{width:min(300px,60vw)!important;height:auto!important}
.code{font-family:var(--f-tick);font-size:clamp(44px,6vw,80px);color:var(--candy);letter-spacing:.08em;line-height:1}
.url{font-size:14px;color:var(--mist);overflow-wrap:anywhere}
.souls{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.soul{background:var(--grave);border:2px solid var(--line);border-radius:60px 60px 14px 14px;padding:22px 12px 14px;text-align:center;min-width:0}
.soul .nm{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.soul .st{font-size:15px;color:var(--mist)}
.soul.ready{border-color:var(--slime)} .soul.ready .st{color:var(--slime)}
.soul.off{opacity:.45}
.soul.empty{border-style:dashed;opacity:.35;display:flex;align-items:center;justify-content:center;min-height:100px;color:var(--mist)}
.bigline{font-size:clamp(22px,2.4vw,32px);font-weight:600}
.bigline b{color:var(--candy)}
.rs-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.stage{background:linear-gradient(160deg,var(--tomb),var(--grave));border:3px solid var(--pumpkin);border-radius:28px;padding:clamp(20px,3vw,40px);position:relative;overflow:hidden}
.stage .num{color:var(--mist);font-size:18px}
.stage .tk{font-size:clamp(56px,8vw,120px);color:var(--pumpkin);line-height:1;margin:6px 0 10px}
.stage .htags{font-size:clamp(22px,2.4vw,34px)}
.stage .pitch{font-size:clamp(22px,2.4vw,34px);margin-top:16px;overflow-wrap:anywhere}
.stage .pitch::before{content:"“";color:var(--pumpkin)} .stage .pitch::after{content:"”";color:var(--pumpkin)}
.stage .bar{height:12px;margin-top:22px}
.clock{font-family:var(--f-tick);font-size:clamp(34px,4vw,56px);color:var(--candy);font-variant-numeric:tabular-nums}
.clock.urgent{color:var(--blood)}
.feed{display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.feed .qa{font-size:clamp(17px,1.6vw,22px);padding:14px 18px;animation:pop .35s ease-out}
.book-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.bk{background:var(--grave);border:2px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.bk .tk{font-size:32px;color:var(--pumpkin)}
.bk .flames{font-size:30px;min-height:40px;letter-spacing:2px}
.bk.hot{border-color:var(--blood);box-shadow:0 0 30px -6px rgba(255,58,92,.6)}
.alloc-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.strings{width:100%;height:auto;display:block}
.strings text{font-family:var(--f-ui);fill:var(--bone)}
.strings .tkt{font-family:var(--f-tick);fill:var(--pumpkin)}
.strings .dim{opacity:.35}
.strings .str{fill:none;stroke:var(--blood);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,58,92,.7))}
.strings .str.new{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s ease-out forwards}
.strings .frz{fill:none;stroke:var(--mist);stroke-width:3;stroke-dasharray:8 8;opacity:.6}
@keyframes draw{to{stroke-dashoffset:0}}
.step-card{border-radius:22px;padding:22px;background:var(--grave);border:3px solid var(--line);animation:pop .4s ease-out}
.step-card.fill{border-color:var(--blood)}
.step-card .lab{font-family:var(--f-tick);font-size:16px;color:var(--mist)}
.step-card .main{font-size:clamp(26px,2.8vw,40px);font-weight:700;margin:6px 0;overflow-wrap:anywhere}
.step-card .main .tk{color:var(--pumpkin)}
.step-card .amt{font-family:var(--f-tick);color:var(--candy);font-size:clamp(28px,3vw,44px)}
.step-card .others{color:var(--mist);font-size:17px;margin-top:8px;overflow-wrap:anywhere}
.reveal-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.circle text{font-family:var(--f-ui);fill:var(--bone);font-weight:600}
.circle .node{fill:var(--tomb);stroke:var(--line);stroke-width:3}
.circle .node.lit{stroke:var(--pumpkin)}
.circle .arrow{fill:none;stroke:var(--blood);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,58,92,.7))}
.circle .arrow.new{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.3s ease-out forwards}
.circle .atk{font-family:var(--f-tick);fill:var(--candy);font-size:20px}
.ledger{display:flex;flex-direction:column;gap:8px}
.ledger .row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:var(--grave);border-radius:14px;padding:12px 16px;font-size:clamp(17px,1.6vw,22px);animation:pop .4s}
.ledger .row .ar{color:var(--blood);font-weight:700}
.ledger .row .to{text-align:right}
.ledger .row .gift{grid-column:1/-1;font-size:.8em}
.ledger .row .gift .tk{color:var(--pumpkin)}
.drum{text-align:center;padding:20px;border-radius:22px;background:var(--grave);border:3px solid var(--pumpkin)}
.drum .tk{font-size:clamp(40px,5vw,72px);color:var(--pumpkin)}
.drum .by{font-size:clamp(22px,2.4vw,34px);margin-top:8px}
.drum .by b{color:var(--blood);font-size:1.3em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tomb);border:2px solid var(--pumpkin);border-radius:14px;padding:10px 18px;z-index:50;max-width:90vw;text-align:center}
@media (max-width:900px){.lobby-grid,.rs-grid,.alloc-grid,.reveal-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  .tape .run,.feed .qa,.step-card,.ledger .row,.feed-row{animation:none}
  .strings .str.new,.circle .arrow.new{animation:none;stroke-dashoffset:0}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";
/* ===================== config ===================== */
const _F=/[?&]fast/.test(location.search)&&/[?&]bc/.test(location.search)?0.1:1; // test-only speedup
const RS_MS=45000*_F, BOOK_MS=120000*_F, CAPITAL=100, STEP=10, START_MS=5000*_F, ALLOC_MS=4000*_F, REVEAL_MS=5500*_F;
const PEER_PREFIX='trick-or-trade-v1-';
const TICKERS=['BOO','GHST','PMKN','BATS','FANG','HEX','GOO','SKUL','WTCH','CNDY','MUMY','ZMBI','CRPT','HOWL','EEK','SPDR','CRWS','BREW','COFN','MOON'];
const TAG_SUGGEST=['#會發光','#吃的','#實用','#療癒','#搞笑','#毛茸茸','#香香的','#很重'];
const QUICK_Q=['Can I eat it?','Can I wear it?','Is it useful?','Is it a joke?'];
const QUICK_A=['Yes','No','Kinda','🤐'];

const params=new URLSearchParams(location.search);
const TEST=params.has('bc');
const BASE=location.href.split('?')[0].split('#')[0];

/* ===================== helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function parseTags(str){return [...new Set(String(str).split(/[\s,，、#＃]+/).map(t=>t.trim()).filter(Boolean).map(t=>'#'+t.slice(0,12)))].slice(0,4)}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let toastT;function toast(t,ms){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||2500)}
function setHTML(el,h){if(!el)return;if(el._h!==h){el.innerHTML=h;el._h=h}}
const fmtClock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ===================== sound ===================== */
let AC=null,soundOn=false;
function tone(f,d,type,v,delay){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={bell(){tone(392,1.4,'triangle',.16);tone(587,1.2,'sine',.08,.04);tone(784,1,'sine',.05,.08)},tick(){tone(880,.06,'square',.04)},
  string(){tone(220,.5,'sawtooth',.06);tone(330,.6,'triangle',.08,.08)},boo(){tone(180,.9,'sine',.15);tone(140,1.1,'sine',.12,.2)},gong(){for(let i=0;i<3;i++)tone(110+i*55,2,'sine',.12,i*.05)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="sound"]');if(!b)return;soundOn=!soundOn;b.textContent=soundOn?'🔊 Sound on':'🔈 Sound off';if(soundOn)sfx.bell()});
const soundBtn=()=>'<button class="btn sec" data-act="sound" style="padding:8px 14px;font-size:15px">'+(soundOn?'🔊 Sound on':'🔈 Sound off')+'</button>';

/* ===================== transport ===================== */
function fakeConn(ch,from,to){const h={};return{send(d){ch.postMessage({to,from,kind:'data',data:d})},on(ev,f){(h[ev]=h[ev]||[]).push(f)},_emit(ev,d){(h[ev]||[]).forEach(f=>f(d))},close(){ch.postMessage({to,from,kind:'close'})}}}
const Net={
  host(room,{onConn,onReady,onError}){
    if(TEST){const ch=new BroadcastChannel('tot-'+room),conns={};
      ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;let c=conns[m.from];
        if(m.kind==='close'){if(c){c._emit('close');delete conns[m.from]}return}
        if(!c){c=conns[m.from]=fakeConn(ch,'host',m.from);onConn(c)}c._emit('data',m.data)};
      setTimeout(onReady,0);return}
    if(!window.Peer){onError({type:'nolib'});return}
    const peer=new Peer(PEER_PREFIX+room.toLowerCase());
    peer.on('open',onReady);peer.on('connection',c=>{c.on('open',()=>onConn(c))});
    peer.on('error',e=>onError(e,peer));
    peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect()}catch(e){}},1500)});
  },
  join(room,{onOpen,onData,onClose,onError}){
    if(TEST){const me='c'+uid(),ch=new BroadcastChannel('tot-'+room),c=fakeConn(ch,me,'host');

function newCode(){const L='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s}

/* =====================================================================
   HOST — runs the whole game automatically; the screen is display only.

function startHost(room){
  let S=store.get('tot-host');
  if(!S||S.room!==room)S={room,created:Date.now(),phase:'lobby',players:{},ready:{},startAt:0,order:[],rsIdx:0,rsEndsAt:0,qa:[],bookEndsAt:0,orders:{},locked:{},alloc:null,allocShown:0,revealShown:0,nextAt:0};
  Object.values(S.players).forEach(p=>p.on=false);
  const conns=new Map(),joinURL=BASE+'?room='+room+(TEST?'&bc=1':'');
  let ready=false,lastKey='';
  const listed=()=>Object.keys(S.players).filter(id=>S.players[id].tk).sort((a,b)=>S.players[a].at-S.players[b].at);
  const nm=id=>(S.players[id]&&S.players[id].name)||'???';
  const tkOf=id=>(S.players[id]&&S.players[id].tk)||'???';

  function connect(attempt){
    Net.host(room,{
      onReady(){ready=true;render()},
      onConn(c){let pid=null;
        c.on('data',m=>{if(!m||typeof m!=='object'||!m.pid)return;const p=String(m.pid).slice(0,40);if(pid!==p){pid=p}conns.set(pid,c);handle(pid,m)});
        c.on('close',()=>{if(pid&&conns.get(pid)===c){conns.delete(pid);if(S.players[pid]){S.players[pid].on=false;sync()}}})},
      onError(e,peer){
        if(e&&e.type==='unavailable-id'){try{peer.destroy()}catch(x){}if((attempt||0)<15){setTimeout(()=>connect((attempt||0)+1),3000);setHTML($('#netStatus'),'Reclaiming room '+room+'…')}else toast('Room '+room+' is busy. Open a new trading floor.',8000);return}
        if(e&&e.type==='nolib'){toast('Could not load the connection library. Check the internet.',8000);return}
        if(e&&/network|server-error|socket-error/.test(e.type||''))toast('Connection hiccup, retrying…')}
    });
  }
  connect(0);

  function handle(pid,m){
    const P=S.players[pid];
    switch(m.t){
      case 'hello':if(P)P.on=true;sync();break;
      case 'list':{
        if(S.phase!=='lobby')return;
        let name=String(m.name||'').trim().slice(0,14)||'Ghost';
        const taken=new Set(Object.keys(S.players).filter(id=>id!==pid).map(id=>S.players[id].name));let n=name,k=2;while(taken.has(n))n=name+' '+(k++);
        const tags=(Array.isArray(m.tags)?m.tags:[]).map(t=>String(t).slice(0,13)).slice(0,4);
        let tk=P&&P.tk;if(!tk){const used=new Set(Object.values(S.players).map(p=>p.tk));const free=TICKERS.filter(t=>!used.has(t));tk=free.length?free[Math.floor(Math.random()*free.length)]:'G'+Math.floor(Math.random()*900+100)}
        S.players[pid]={name:n,tags,pitch:String(m.pitch||'').trim().slice(0,80),tk,at:P&&P.at||Date.now(),on:true};
        delete S.ready[pid];sfx.tick();sync();break;}
      case 'ready':if(S.phase==='lobby'&&P&&P.tk){if(m.v)S.ready[pid]=true;else delete S.ready[pid];sync()}break;
      case 'ask':{
        if(S.phase!=='roadshow')return;const g=S.order[S.rsIdx];if(!g||g===pid||!S.order.includes(pid))return;
        const q=String(m.q||'').trim().slice(0,100);if(!q||S.qa.filter(x=>x.g===g&&x.by===pid).length>=6)return;
        S.qa.push({id:uid(),g,by:pid,q,a:null});sfx.tick();sync();break;}
      case 'answer':{const it=S.qa.find(x=>x.id===m.qid);if(!it||it.g!==pid)return;it.a=String(m.a||'').trim().slice(0,100)||null;sync();break;}
      case 'orders':{
        if(S.phase!=='book'||!S.order.includes(pid))return;
        const byTk=m.ordersTk||{},clean={};let sum=0;
        for(const g of S.order){if(g===pid)continue;const v=Math.max(0,Math.floor(+byTk[tkOf(g)]||0));if(v>0&&sum+v<=CAPITAL){clean[g]=v;sum+=v}}
        S.orders[pid]=clean;delete S.locked[pid];sync();break;}
      case 'lock':if(S.phase==='book'&&S.order.includes(pid)){if(m.v)S.locked[pid]=true;else delete S.locked[pid];sync()}break;
    }
  }

  /* ---- what phones may see (never who owns which ticker until the reveal) ---- */
  function heatMap(){const h={};S.order.forEach(g=>h[tkOf(g)]=0);Object.values(S.orders).forEach(o=>Object.keys(o).forEach(g=>{if(o[g]>0&&S.players[g])h[tkOf(g)]++}));return h}

  function meView(pid){

      if(S.phase==='reveal'){const sh=S.alloc.result.slice(0,S.revealShown);const a=sh.find(x=>x.b===pid);if(a)me.from=nm(a.g);const b=sh.find(x=>x.g===pid);if(b)me.gaveTo=nm(b.b)}

  }
  function sync(){store.set('tot-host',S);const pub=pubView();conns.forEach((c,pid)=>{try{c.send({t:'view',pub,me:meView(pid)})}catch(e){}});render()}

  /* ---- automatic flow ---- */
  function startRoadshow(){const ids=listed();if(ids.length<2)return;S.order=shuffle(ids.slice());S.rsIdx=0;S.rsEndsAt=Date.now()+RS_MS;S.phase='roadshow';S.startAt=0;sfx.bell();sync()}
  function nextStock(){S.rsIdx++;if(S.rsIdx>=S.order.length){S.phase='book';S.bookEndsAt=Date.now()+BOOK_MS;sfx.gong()}else{S.rsEndsAt=Date.now()+RS_MS;sfx.bell()}sync()}
  function closeBook(){S.alloc=allocate();S.allocShown=0;S.phase='alloc';S.nextAt=Date.now()+3000;sfx.gong();sync()}
  function allocNext(){
    if(S.allocShown<S.alloc.steps.length){S.allocShown++;S.alloc.steps[S.allocShown-1].type==='freeze'?sfx.boo():sfx.string();S.nextAt=Date.now()+ALLOC_MS}

  }
  function revealNext(){if(S.revealShown<S.alloc.result.length){S.revealShown++;sfx.string();S.nextAt=Date.now()+REVEAL_MS;sync()}}

  function allocate(){
    const ids=S.order.slice(),all=[];
    ids.forEach(b=>{const o=S.orders[b]||{};ids.forEach(g=>{if(g!==b&&o[g]>0)all.push({b,g,a:o[g],r:Math.random()})})});
    all.sort((x,y)=>y.a-x.a||x.r-y.r);

    for(const o of all){
      if(tB.has(o.b)||tG.has(o.g))continue;

    people.forEach(id=>{svg+=`<text x="235" y="${py[id]+8}" text-anchor="end" font-size="26" class="${fB.has(id)||done?'':'dim'}">${esc(nm(id))}</text><circle cx="250" cy="${py[id]}" r="8" fill="#f6eddc"/>`});
    ids.forEach(g=>{svg+=`<circle cx="750" cy="${gy[g]}" r="8" fill="#ff7a1a"/><text x="768" y="${gy[g]+9}" font-size="26" class="tkt ${fG.has(g)||done?'':'dim'}">$${esc(tkOf(g))}</text>`});
    setHTML($('#strings'),svg);
    const last=shown[shown.length-1];let c;
    if(!last)c=`<div class="step-card"><div class="lab">MATCHING</div><div class="main">Bidding closed.</div><div class="others">Highest bid gets matched first. Everyone gets exactly one gift, never their own.</div></div>`;
    else if(last.type==='fill')c=`<div class="step-card fill"><div class="lab">MATCH #${shown.filter(s=>s.type!=='freeze').length}${last.tie?' · TIE, ghost dice decided':''}</div><div class="main">${esc(nm(last.b))} → <span class="tk">$${esc(tkOf(last.g))}</span></div><div class="amt">${last.a} candy</div>${last.others.length?`<div class="others">Outbid: ${last.others.map(o=>esc(nm(o.b))+' '+o.a).join(' · ')}</div>`:''}</div>`;
    else if(last.type==='freeze')c=`<div class="step-card"><div class="lab">FROZEN BY A GHOST 👻</div><div class="main">${esc(nm(last.b))} → <span class="tk">$${esc(tkOf(last.g))}</span> @ ${last.a}</div><div class="others">This would leave someone holding their own gift, so it’s skipped.</div></div>`;
    else c=`<div class="step-card fill"><div class="lab">LEFTOVER</div><div class="main">${esc(nm(last.b))} → <span class="tk">$${esc(tkOf(last.g))}</span></div><div class="others">No bid matched, so ${esc(nm(last.b))} takes a gift nobody won.</div></div>`;
    setHTML($('#stepCard'),c);
  }
  function hReveal(m){
    const res=S.alloc.result,shown=res.slice(0,S.revealShown);
    if(!m._built){m._built=true;m.innerHTML=`<div class="h-main reveal-grid"><div class="card"><svg class="circle" viewBox="0 0 1000 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3a5c"/></marker></defs><g id="cg"></g></svg></div>
      <div style="display:flex;flex-direction:column;gap:14px"><div id="drum"></div><div class="ledger" id="ledger"></div></div></div>`}
    const ids=S.order.slice().sort((a,b)=>S.players[a].at-S.players[b].at),n=ids.length,cx=500,cy=380,R=290,pos={};
    ids.forEach((id,i)=>{const t=-Math.PI/2+i*2*Math.PI/n;pos[id]={x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)}});
    const lit=new Set();shown.forEach(r=>{lit.add(r.b);lit.add(r.g)});let g='';
    shown.forEach((r,i)=>{const a=pos[r.g],b=pos[r.b],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx0=b.x-a.x,dy0=b.y-a.y;
      const qx=mx-dy0*.22,qy=my+dx0*.22,ua=Math.hypot(qx-a.x,qy-a.y)||1,sx=a.x+(qx-a.x)/ua*62,sy=a.y+(qy-a.y)/ua*62,ub=Math.hypot(b.x-qx,b.y-qy)||1,ex=b.x-(b.x-qx)/ub*64,ey=b.y-(b.y-qy)/ub*64;
      g+=`<path class="arrow ${i===shown.length-1?'new':''}" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" marker-end="url(#ah)"/>`;
      const tx=(sx+2*qx+ex)/4,ty=(sy+2*qy+ey)/4;g+=`<text class="atk" x="${tx.toFixed(1)}" y="${(ty+7).toFixed(1)}" text-anchor="middle" paint-order="stroke" stroke="#1c1228" stroke-width="6">$${esc(tkOf(r.g))}</text>`});
    ids.forEach(id=>{const p=pos[id];g+=`<circle class="node ${lit.has(id)?'lit':''}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="56"/><text x="${p.x.toFixed(1)}" y="${(p.y+8).toFixed(1)}" text-anchor="middle" font-size="${nm(id).length>6?18:24}">${esc(nm(id))}</text>`});
    setHTML($('#cg'),g);
    const last=shown[shown.length-1],all=S.revealShown>=res.length;
    setHTML($('#drum'),all?`<div class="drum"><div class="tk">Happy Halloween</div><div class="by">Go open your gifts 🎃</div></div>`
      :last?`<div class="drum"><div class="tk">$${esc(tkOf(last.g))}</div><div class="htags">${esc(S.players[last.g].tags.join(' '))}</div><div class="by">from <b>${esc(nm(last.g))}</b><br>to ${esc(nm(last.b))}</div></div>`
      :`<div class="drum"><div class="by">Who brought what?<br><span class="muted">Revealing every gift’s owner…</span></div></div>`);
    setHTML($('#ledger'),shown.map(r=>`<div class="row"><div>${esc(nm(r.g))}</div><div class="ar">→</div><div class="to">${esc(nm(r.b))}</div><div class="gift"><span class="tk">$${esc(tkOf(r.g))}</span> <span class="htags">${esc(S.players[r.g].tags.join(' '))}</span></div></div>`).join(''));
  }
  render();
}

/* =====================================================================
   PHONE — one thing to do per screen
   ===================================================================== */
function startPhone(room){
  const KEY='tot-pid-'+room;
  let pid=(TEST&&params.get('pid'))||store.get(KEY);if(!pid){pid='p'+uid()+uid();store.set(KEY,pid)}
  let conn=null,V=null,offset=0,online=false,retryT=0,lastKey='',editing=false,draft=null,draftT=0,ownQ=false,statusMsg='';

  function connect(){
    Net.join(room,{
      onOpen(c){conn=c;online=true;statusMsg='';c.send({t:'hello',pid});render()},
      onData(m){if(m&&m.t==='view'){offset=m.pub.now-Date.now();V=m;if(V.pub.phase!=='book')draft=null;render()}},
      onClose(){conn=null;online=false;render();clearTimeout(retryT);retryT=setTimeout(connect,2000)},
      onError(e){conn=null;online=false;statusMsg=e&&e.type==='peer-unavailable'?'Room '+room+' not found. Is the big screen open?':e&&e.type==='nolib'?'Could not load the connection library. Check your internet.':'';render();clearTimeout(retryT);retryT=setTimeout(connect,2500)}
    });
  }
  const send=m=>{if(conn){try{conn.send(Object.assign({pid},m))}catch(e){}}else toast('Reconnecting… try again in a second.')};
  connect();

  app.innerHTML=`<div class="phone">
    <div class="ph-head"><div class="logo">Trick<span class="or">or</span>Trade</div><span class="pill" id="pill"><span class="dot"></span><span id="pillTxt"></span></span></div>
    <div id="prog"></div><div id="pbody" style="display:flex;flex-direction:column;gap:16px;flex:1"></div>
    <div class="muted center" id="pstatus" style="font-size:13px"></div><div class="center">${soundBtn()}</div></div>`;

  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-p]');if(!b||b.disabled)return;const a=b.dataset.p;
    if(a==='chip'){const t=$('#tagIn');let cur=parseTags(t.value);const v=b.dataset.v;cur=cur.includes(v)?cur.filter(x=>x!==v):cur.length<4?cur.concat(v):cur;t.value=cur.join(' ');syncChips();return}
    if(a==='edit'){editing=true;lastKey='';render();return}
    if(a==='ready'){send({t:'ready',v:!V.me.ready});return}
    if(a==='q'){send({t:'ask',q:b.dataset.v});toast('Sent anonymously 👻');return}
    if(a==='ownq'){ownQ=!ownQ;lastKey='';render();return}
    if(a==='askfree'){const i=$('#qIn'),q=i.value.trim();if(!q)return;send({t:'ask',q});i.value='';toast('Sent anonymously 👻');return}
    if(a==='ans'){send({t:'answer',qid:b.dataset.q,a:b.dataset.v});return}
    if(a==='ansfree'){const i=document.getElementById('a-'+b.dataset.q),v=i&&i.value.trim();if(v)send({t:'answer',qid:b.dataset.q,a:v});return}
    if(a==='pm'){
      if(V.me.locked)return;
      draft=draft||Object.assign({},V.me.ordersTk);const tk=b.dataset.tk,d=+b.dataset.d,cur=draft[tk]||0,left=CAPITAL-Object.values(draft).reduce((s,v)=>s+v,0);
      draft[tk]=Math.max(0,Math.min(cur+d,cur+left));renderBook();clearTimeout(draftT);draftT=setTimeout(()=>send({t:'orders',ordersTk:draft}),300);return}
    if(a==='lock'){clearTimeout(draftT);if(draft)send({t:'orders',ordersTk:draft});setTimeout(()=>send({t:'lock',v:true}),draft?120:0);return}
    if(a==='unlock'){send({t:'lock',v:false});return}
  });
  app.addEventListener('input',e=>{if(e.target.id==='tagIn')syncChips()});
  app.addEventListener('submit',e=>{
    if(e.target.id!=='listForm')return;e.preventDefault();
    const name=$('#nameIn').value.trim(),tags=parseTags($('#tagIn').value),pitch=$('#pitchIn').value.trim();
    if(!name){toast('Add your name.');$('#nameIn').focus();return}
    if(!tags.length){toast('Pick or type at least one hashtag.');$('#tagIn').focus();return}
    store.set('tot-last-name',name);editing=false;lastKey='';send({t:'list',name,tags,pitch});
  });
  app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
    if(e.target.id==='qIn'){e.preventDefault();$('[data-p="askfree"]').click()}
    else if(e.target.id&&e.target.id.startsWith('a-')){e.preventDefault();const b=e.target.parentElement.querySelector('[data-p="ansfree"]');b&&b.click()}});
  function syncChips(){const cur=parseTags($('#tagIn').value);document.querySelectorAll('[data-p="chip"]').forEach(c=>c.classList.toggle('on',cur.includes(c.dataset.v)))}

  const STEPS=[['lobby','List'],['roadshow','Q&A'],['book','Bid'],['alloc','Reveal']];
  function progress(ph){const idx={lobby:0,roadshow:1,book:2,alloc:3,reveal:3}[ph]??0;
    return `<div class="steps">${STEPS.map((s,i)=>`<div class="${i<idx?'done':i===idx?'now':''}"></div>`).join('')}</div><div class="stepname" style="margin-top:6px">${STEPS.map((s,i)=>i===idx?`<b>${s[1]}</b>`:`<span>${s[1]}</span>`).join('')}</div>`}

  function render(){
    $('#pill').classList.toggle('off',!online);
    setHTML($('#pillTxt'),online?(V&&V.me.listed?esc(V.me.name)+' · $'+esc(V.me.tk):'Room '+esc(room)):'Connecting…');
    setHTML($('#pstatus'),online?'':esc(statusMsg||'Connecting to room '+room+'…'));
    const body=$('#pbody');
    if(!V){setHTML($('#prog'),'');setHTML(body,`<div class="center" style="padding-top:40px"><div class="bigtk">Boo.</div><p class="muted">Connecting to room ${esc(room)}…</p></div>`);lastKey='';return}
    const ph=V.pub.phase,me=V.me;
    setHTML($('#prog'),progress(ph));
    let key=ph;
    if(ph==='lobby')key+=me.listed&&!editing?':wait':':form';
    else if(!me.inGame)key='spectator';
    else if(ph==='roadshow'){const mine=V.pub.stocks[V.pub.rsIdx].tk===me.tk;key+=':'+V.pub.rsIdx+(mine?':mine':':ask'+(ownQ?'1':'0'))}
    else if(ph==='book')key+=me.locked?':locked':':open';
    if(key!==lastKey){body.innerHTML='';body._h=null;lastKey=key;build(body,key)}
    update(key);
  }
  function build(body,key){
    const me=V.me,P=V.pub;
    if(key==='spectator'){body.innerHTML=`<div class="center" style="padding-top:30px"><div class="bigtk">Too late!</div><p class="muted">This round already started. Watch the big screen and join the next one.</p></div>`;return}
    if(key==='lobby:form'){
      const p=me.listed?me:{};
      body.innerHTML=`<div><h2 class="title">List your gift</h2><p class="sub">Nobody will know it’s yours until the end.</p></div>
      <form class="card" id="listForm" autocomplete="off">
        <div class="field"><label for="nameIn">Your name</label><input type="text" id="nameIn" maxlength="14" value="${esc(p.name||store.get('tot-last-name')||'')}" placeholder="e.g. Pumpkin Pete"></div>
        <div class="field"><label for="tagIn">Describe your gift with hashtags</label><input type="text" id="tagIn" maxlength="60" value="${esc((p.tags||[]).join(' '))}" placeholder="Tap below or type your own">
          <div class="chips">${TAG_SUGGEST.map(t=>`<button type="button" class="chip" data-p="chip" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
        <div class="field" style="margin-bottom:20px"><label for="pitchIn">Sales pitch <span class="opt">(optional)</span></label><input type="text" id="pitchIn" maxlength="80" value="${esc(p.pitch||'')}" placeholder="Your winter will thank you."></div>
        <button class="btn huge wide" type="submit">List my gift</button></form>`;
      syncChips();return}
    if(key==='lobby:wait'){body.innerHTML=`<div class="stock center"><div class="muted">Your gift is listed as</div><div class="tk" style="margin-top:6px">$${esc(me.tk)}</div><div class="htags">${esc(me.tags.join(' '))}</div></div>
      <div id="waitInfo" class="center"></div><div class="bottom"><button class="btn huge wide" data-p="ready" id="readyBtn"></button><div class="center"><button class="link" data-p="edit">Edit my gift</button></div></div>`;return}
    if(key.endsWith(':mine')){body.innerHTML=`<div class="stock" id="rsCard"></div><div class="card answer"><div style="font-size:20px;font-weight:700">🤫 This is your gift!</div><div class="muted">Answer the questions. Don’t get caught.</div></div><div id="ansList" class="feedmini"></div>`;return}
    if(key.startsWith('roadshow')){
      body.innerHTML=`<div class="stock" id="rsCard"></div><div><div style="font-weight:700;font-size:18px;margin-bottom:8px">Ask the owner (anonymous)</div>
        ${ownQ?`<div class="inrow"><input type="text" id="qIn" maxlength="100" placeholder="Type a question…"><button class="btn" data-p="askfree">Ask</button></div><button class="link" data-p="ownq">Back to quick questions</button>`
        :`<div class="qgrid">${QUICK_Q.map(q=>`<button class="qbtn" data-p="q" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="center"><button class="link" data-p="ownq">✏️ Ask my own question</button></div>`}</div>
        <div id="ansList" class="feedmini"></div><div><div class="muted" style="margin-bottom:6px">Latest answers</div><div class="feedmini" id="rsFeed"></div></div>`;
      if(ownQ)setTimeout(()=>{const i=$('#qIn');i&&i.focus()},50);return}
    if(key==='book:open'){body.innerHTML=`<div><h2 class="title">Bid in secret</h2><p class="sub">You have 100 candy. Put more on the gift you want most. Highest bid in the room gets matched first.</p></div>
      <div class="candy-left"><div><div class="muted" style="font-size:13px">Candy left</div><div class="n" id="left"></div></div><div style="text-align:right"><div class="muted" style="font-size:13px">Time left</div><div class="tk" id="btimer" style="color:var(--candy)"></div></div></div>
      <div id="bids" style="display:flex;flex-direction:column;gap:10px"></div><div id="ansList" class="feedmini"></div>
      <div class="bottom"><button class="btn huge wide" data-p="lock" id="lockBtn">Lock in my bids</button></div>`;return}
    if(key==='book:locked'){body.innerHTML=`<div class="center" style="padding-top:20px"><div class="bigtk">Locked ✓</div><p class="muted" id="lockInfo"></p></div><div class="card" id="mySummary"></div><div id="ansList" class="feedmini"></div>
      <div class="bottom"><button class="btn sec wide" data-p="unlock">Change my bids</button></div>`;return}
    if(key==='alloc'||key==='reveal'){body.innerHTML=`<div id="mine"></div><div><div class="muted" style="margin-bottom:6px" id="feedTitle"></div><div class="feedmini" id="feedAll"></div></div>`;return}
  }
  function update(key){
    const P=V.pub,me=V.me;
    if(key==='lobby:wait'){
      const L=P.players.filter(p=>p.listed),n=L.filter(p=>p.ready).length;
      setHTML($('#waitInfo'),P.startAt?`<div class="count">${Math.max(0,Math.ceil((P.startAt-(Date.now()+offset))/1000))}</div><div class="muted">Starting…</div>`
        :`<div style="font-size:18px">${n} of ${L.length} ready</div><div class="muted">${L.map(p=>esc(p.name)+(p.ready?' ✓':'')).join(' · ')}</div><div class="muted" style="margin-top:6px">${L.length<2?'Waiting for at least one more player.':'The game starts when everyone is ready.'}</div>`);
      const b=$('#readyBtn');b.className='btn huge wide'+(me.ready?' ok':'');b.textContent=me.ready?'Ready ✓  (tap to undo)':'I’m ready';
    }
    if(key.startsWith('roadshow')){
      const s=P.stocks[P.rsIdx];
      setHTML($('#rsCard'),`<div style="display:flex;justify-content:space-between" class="muted"><span>Gift ${P.rsIdx+1} of ${P.stocks.length}</span><span id="rtimer"></span></div><div class="tk" style="margin-top:4px">$${esc(s.tk)}</div><div class="htags">${esc(s.tags.join(' '))}</div>${s.pitch?`<div class="pitch">“${esc(s.pitch)}”</div>`:''}<div class="bar"><i id="rbar"></i></div>`);
      const qs=P.qa.filter(x=>x.tk===s.tk&&x.a).slice(-3).reverse();
      setHTML($('#rsFeed'),qs.length?qs.map(x=>`<div class="qa"><div class="q">${esc(x.q)}</div><div class="a">${esc(x.a)}</div></div>`).join(''):'<div class="muted">No answers yet.</div>');
    }
    if($('#ansList'))renderAnswers();
    if(key==='book:open')renderBook();
    if(key==='book:locked'){
      setHTML($('#lockInfo'),`${P.lockedN} of ${P.traders} locked in. Bidding ends when everyone locks or time runs out.`);
      const o=Object.entries(me.ordersTk).filter(([,v])=>v>0);
      setHTML($('#mySummary'),o.length?`<div class="muted" style="margin-bottom:6px">Your bids</div>`+o.map(([t,v])=>`<div style="display:flex;justify-content:space-between;font-size:18px"><span class="tk" style="color:var(--pumpkin)">$${esc(t)}</span><b>${v}</b></div>`).join(''):'<div class="muted">You didn’t bid on anything. You’ll get a leftover gift.</div>');
    }
    if(key==='alloc'||key==='reveal'){
      if(key==='alloc'){
        setHTML($('#mine'),me.got?`<div class="card result" style="border-color:var(--slime)"><div class="muted">You got</div><div class="tk">$${esc(me.got.tk)}</div><div class="htags">${esc(me.got.tags.join(' '))}</div></div>`
          :`<div class="center" style="padding-top:10px"><div class="bigtk">Matching…</div><p class="muted">Watch the big screen. Your gift will show up here.</p></div>`);
        setHTML($('#feedTitle'),'Matches so far');
        setHTML($('#feedAll'),(P.fills||[]).slice().reverse().map(f=>`<div class="feed-row ${f.type==='freeze'?'frz':''} ${f.who===me.name&&f.type!=='freeze'?'me':''}"><span>${esc(f.who)} → <span class="tk">$${esc(f.tk)}</span>${f.type==='freeze'?' 👻 frozen':''}</span><span class="muted">${f.a?f.a+' 🍬':'leftover'}</span></div>`).join('')||'<div class="muted">First match coming up…</div>');
      }else{
        setHTML($('#mine'),`<div class="card result"><div class="muted">You got</div><div class="tk">$${esc(me.got?me.got.tk:'???')}</div><div class="htags">${esc(me.got?me.got.tags.join(' '):'')}</div>
          <div class="from">${me.from?`from <b>${esc(me.from)}</b>`:'<span class="muted">from… watch the big screen</span>'}</div></div>
          <div class="card center"><div class="muted">Your $${esc(me.tk)} went to</div><div style="font-size:24px;font-weight:700">${me.gaveTo?esc(me.gaveTo):'<span class="muted">…</span>'}</div></div>
          ${P.revealDone?'<div class="center"><div class="bigtk">Happy Halloween</div><p class="muted">Go open your gift 🎃</p></div>':''}`);
        setHTML($('#feedTitle'),'Who gave what');
        setHTML($('#feedAll'),(P.reveals||[]).slice().reverse().map(r=>`<div class="feed-row"><span>${esc(r.from)} → ${esc(r.to)}</span><span class="tk">$${esc(r.tk)}</span></div>`).join(''));
      }
    }
    tickPhone();
  }
  function renderAnswers(){
    const el=$('#ansList');if(!el)return;const open=V.me.myQs.filter(q=>!q.a),ids=open.map(q=>q.id).join(',');
    if(el._ids===ids)return;
    const keep={};el.querySelectorAll('input[id^="a-"]').forEach(i=>keep[i.id]=i.value);
    const mine=lastKey.endsWith(':mine');
    el.innerHTML=open.length?`${mine?'':`<div style="font-weight:700">Questions about your gift</div>`}`+open.map(q=>`<div class="qa answer"><div class="q" style="font-size:18px">${esc(q.q)}</div>
      <div class="abtns">${QUICK_A.map(a=>`<button data-p="ans" data-q="${esc(q.id)}" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
      <div class="inrow"><input type="text" id="a-${esc(q.id)}" maxlength="100" placeholder="…or type an answer" value="${esc(keep['a-'+q.id]||'')}"><button class="btn sec" data-p="ansfree" data-q="${esc(q.id)}">Send</button></div></div>`).join('')
      :(mine?'<div class="muted center">No questions yet. Waiting for the crowd…</div>':'');
    el._ids=ids;
  }
  function renderBook(){
    const P=V.pub,me=V.me,el=$('#bids');if(!el)return;
    const d=draft||me.ordersTk,used=Object.values(d).reduce((s,v)=>s+v,0),left=CAPITAL-used;
    const L=$('#left');L.textContent=left;L.classList.toggle('zero',left===0);
    setHTML(el,P.stocks.filter(s=>s.tk!==me.tk).map(s=>{const v=d[s.tk]||0;return `<div class="bid ${v?'has':''}"><div style="min-width:0"><div class="tk">$${esc(s.tk)}</div><div class="t">${esc(s.tags.join(' '))}</div>${s.pitch?`<div class="p">${esc(s.pitch)}</div>`:''}</div>
      <div class="pm"><button data-p="pm" data-tk="${esc(s.tk)}" data-d="-${STEP}" ${v<=0?'disabled':''} aria-label="less">−</button><span class="v ${v?'has':''}">${v}</span><button data-p="pm" data-tk="${esc(s.tk)}" data-d="${STEP}" ${left<=0?'disabled':''} aria-label="more">+</button></div></div>`}).join(''));
    $('#lockBtn').textContent=used?'Lock in my bids':'Lock in (no bids)';
  }
  function tickPhone(){
    if(!V)return;const now=Date.now()+offset,P=V.pub;
    if(P.phase==='roadshow'){const left=P.rsEndsAt-now,t=$('#rtimer'),b=$('#rbar');if(t)t.textContent=fmtClock(left);if(b){b.style.width=Math.max(0,Math.min(100,left/RS_MS*100))+'%';b.parentElement.classList.toggle('urgent',left<10000)}}
    if(P.phase==='book'){const t=$('#btimer');if(t)t.textContent=fmtClock(P.bookEndsAt-now)}
    if(P.phase==='lobby'&&P.startAt){const c=document.querySelector('#waitInfo .count');if(c)c.textContent=Math.max(0,Math.ceil((P.startAt-now)/1000))}
  }
  setInterval(tickPhone,250);
  render();
}
})();
</script>
</body>
</html>
